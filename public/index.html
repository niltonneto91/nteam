<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>nTeam · NTN Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/vendor/chart-4.4.1.umd.min.js"></script>
<style>
/* Layout: app shell — sidebar de navegação + área de trabalho; ficha do colaborador abre em painel lateral */
:root{
  --bg:#eef0ee; --surface:#fcfcfb; --surface-2:#f3f5f3; --line:#d9dedb; --ink:#141a1c; --ink-2:#4a5457; --muted:#7a8487;
  --accent:#0d5876; --accent-ink:#ffffff; --accent-soft:#dbe9ef; --side:#0f2a33; --side-ink:#c9d9de; --side-active:#ffffff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e1f2df; --warn-soft:#fbefd2; --serious-soft:#fbe6dc; --crit-soft:#f7dfdf;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 16px 48px rgba(10,30,40,.07);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101414; --surface:#181d1e; --surface-2:#202627; --line:#30393b; --ink:#edf1f1; --ink-2:#b6c1c3; --muted:#869294;
  --accent:#5fb2d4; --accent-ink:#06222e; --accent-soft:#16323d; --side:#0b1a1f; --side-ink:#a9bfc6; --side-active:#ffffff;
  --good-soft:#15301a; --warn-soft:#382e12; --serious-soft:#3a2418; --crit-soft:#3b1b1b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101414; --surface:#181d1e; --surface-2:#202627; --line:#30393b; --ink:#edf1f1; --ink-2:#b6c1c3; --muted:#869294;
  --accent:#5fb2d4; --accent-ink:#06222e; --accent-soft:#16323d; --side:#0b1a1f; --side-ink:#a9bfc6; --side-active:#ffffff;
  --good-soft:#15301a; --warn-soft:#382e12; --serious-soft:#3a2418; --crit-soft:#3b1b1b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100%}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 12px}
.brand b{font-family:var(--f-display);font-size:29px;font-weight:600;color:#fff;letter-spacing:.01em;line-height:1.1}
.brand b i{font-style:normal;color:#7cc6e3}
.brand small{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:rgba(124,198,227,.16);color:var(--side-active);font-weight:500}
.nav button:focus-visible{outline:2px solid #7cc6e3}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:1px 8px;font-family:var(--f-mono)}
.side-foot{margin-top:auto;font-size:12px;display:flex;flex-direction:column;gap:8px;padding:0 12px}
.side-foot label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.side-foot select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:8px 8px;color:#fff}
.side-foot select option{color:#000}
/* Main */
.main{min-width:0;padding-block:24px 56px;padding-inline:24px}
.topline{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.topline h1{font-family:var(--f-display);font-weight:600;font-size:29px;margin:0;letter-spacing:.01em;text-wrap:balance}
.proto{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);border:1px dashed var(--line);padding:3px 8px;border-radius:4px}
.topline .grow{flex:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1}
.inp,select.inp,textarea.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0}
.inp:focus,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{width:260px;max-width:100%}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 8px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-b{padding:16px 16px}
/* Tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.muted{color:var(--muted)}
.nm{font-weight:500}
.nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;font-family:var(--f-mono)}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;padding:2px 8px 2px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.good{background:var(--good-soft);border-color:transparent}.pill.good::before{background:var(--good)}
.pill.warn{background:var(--warn-soft);border-color:transparent}.pill.warn::before{background:var(--warn)}
.pill.serious{background:var(--serious-soft);border-color:transparent}.pill.serious::before{background:var(--serious)}
.pill.crit{background:var(--crit-soft);border-color:transparent}.pill.crit::before{background:var(--crit)}
.pill.info{background:var(--accent-soft);border-color:transparent}.pill.info::before{background:var(--accent)}
.pill.plain::before{display:none}
.sema{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.sema i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-2);font-size:12px}
.kpi.alert b{color:var(--crit)}
.grid-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chart-box{position:relative;height:250px}
.chart-box.tall{height:300px}
/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:74vh}
.col-h{padding:12px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.col-h b{font-size:14px;font-weight:600}
.col-h .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.col-h .req{display:block;font-size:12px;color:var(--muted);font-weight:400}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:80px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:12px 12px;cursor:grab;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card .t{font-weight:600;font-size:14px;line-height:1.25}
.card .m{font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{white-space:nowrap;font-size:12px;font-family:var(--f-mono);padding:1px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.ok{background:var(--good-soft);border-color:transparent;color:var(--ink)}
.chip.no{background:var(--crit-soft);border-color:transparent;color:var(--ink)}
.card select{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2)}
.card-foot{display:flex;gap:8px;align-items:center;justify-content:space-between}
/* Obras */
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.obra{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.obra:hover{border-color:var(--accent)}
.obra h3{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0;line-height:1.1}
.obra .big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1}
.obra .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.bar-row .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 16px 0}
.drawer-top{display:flex;gap:16px;align-items:flex-start}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:20px;flex:none}
.drawer-top h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.drawer-top .m{color:var(--ink-2);font-size:14px;margin-top:2px}
.drawer-top .x{margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field .inp{width:100%}
.restrito{font-size:12px;color:var(--muted);font-style:italic;padding:8px 0}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:4px 0 -4px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.facts div span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts div b{font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pend{display:flex;flex-wrap:wrap;gap:8px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.ev{position:relative;padding:0 0 16px 16px}
.ev::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.ev .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev .t{font-weight:500}
.ev .x{color:var(--ink-2);font-size:14px}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--good)}
/* Modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;padding:16px}
.modal .scrim{z-index:0}
.modal .box{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow-y:auto}
.modal .box header{padding:16px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.modal .box .bd{padding:16px 16px}
.modal .box footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;z-index:90;font-size:14px;max-width:min(560px,92vw);box-shadow:var(--shadow)}
.toast.warn{background:var(--crit);color:#fff}
.empty{padding:24px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
.cfg-grid .inp{width:100%}
.chkgrid{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.chkgrid label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.grp-h{font-family:var(--f-display);font-size:18px;font-weight:600;margin:12px 0 8px}
.nbtn{all:unset;cursor:pointer;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:4px;min-width:22px;text-align:center;display:inline-block;color:var(--ink)}
.nbtn:hover{background:var(--accent-soft);text-decoration:underline}
.nbtn:focus-visible{outline:2px solid var(--accent)}
.nbtn.z{color:var(--muted)}
tr.grp td{background:var(--surface-2);font-family:var(--f-display);font-size:18px;font-weight:600;padding-top:12px}
.cellbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:4px 8px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink)}
.cellbtn.crit{background:var(--crit-soft)}.cellbtn.good{background:var(--good-soft)}.cellbtn.info{background:var(--accent-soft)}.cellbtn.none{color:var(--muted)}
.cellbtn:focus-visible{outline:2px solid var(--accent)}
.wk th,.wk td{text-align:center}.wk th:first-child,.wk td:first-child{text-align:left}
.modal .box.wide{width:min(940px,100%)}
.banner{border-left:4px solid var(--serious);background:var(--serious-soft);padding:12px 12px;border-radius:6px;font-size:14px;color:var(--ink)}
.reasons{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin:8px 0 12px}
.inline-chk{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.hgt th,.hgt td{text-align:center;padding:8px 8px;white-space:nowrap}
.hgt th:first-child,.hgt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.hgt th.cur{background:var(--accent-soft);color:var(--ink)}
.hgc{min-width:78px;vertical-align:top}
.hgc.np{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 12px)}
.hgc .num{font-size:14px}
.hg{width:56px;text-align:center;padding:4px 4px}
.hg.sel{outline:2px solid var(--accent);background:var(--accent-soft)}
.hg::placeholder{color:var(--muted)}
.hgb{font-size:12px;color:var(--ink-2);background:var(--warn-soft);border-radius:4px;padding:1px 4px;margin-top:3px;white-space:nowrap}
.hgb.late{background:var(--crit-soft)}
.hga{font-size:12px;color:var(--accent);margin-top:2px;white-space:nowrap}
.cfg-grid>*,.two>*,.grid-charts>*,.obras>*,.panel{min-width:0}
.toolbar .pill{white-space:normal}
pre.wa{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:340px;overflow:auto;margin:0}
@media (max-width:767.98px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:12px 12px;gap:12px;z-index:30;overflow-x:auto}
  .brand small{display:none}
  .nav{flex-direction:row}
  .nav button{padding:8px 8px;white-space:nowrap}
  .nav button span.l{display:none}
  .nav button[aria-current="true"] span.l{display:inline}
  .side-foot{margin:0;flex-direction:row;align-items:center}
  .side-foot label{display:none}
  .main{padding-inline:16px}
  .two{grid-template-columns:1fr}
  .cfg-grid{grid-template-columns:1fr}
  .grid-charts{grid-template-columns:1fr}
  .search{width:100%}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .2s ease-out} @keyframes slide{from{transform:translateX(30px)}to{transform:none}} }
/* v4 */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi-g{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 0 8px;font-weight:600}
.kpi[data-act]{cursor:pointer}.kpi[data-act]:hover{border-color:var(--accent)}
.ref{font-size:12px;color:var(--ink-2);margin:-8px 0 12px}
.note.help{margin:0 0 12px}
.q{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1px solid var(--accent);display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:var(--accent);margin-left:4px;vertical-align:1px}
.q:focus-visible{outline:2px solid var(--accent)}
.drawer{width:min(940px,100%)}
.subseg{margin-bottom:2px;align-self:flex-start}
.card{cursor:pointer}.card[draggable="true"]{cursor:grab}.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card.kreq{border-left:3px solid var(--accent)}.card.kcand{border-left:3px solid var(--s3)}

.col.vazia{flex-basis:150px;opacity:.85}

.inp.err{border-color:var(--crit);background:var(--crit-soft)}

.err-box:empty{display:none}

.rel-cat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.rel-g{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:8px 8px 4px}
.rel-cat button{all:unset;cursor:pointer;display:block;padding:8px 8px;border-radius:6px;width:calc(100% - 16px)}
.rel-cat button b{display:block;font-size:14px;font-weight:500}
.rel-cat button small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}
.rel-cat button:hover{background:var(--surface-2)}.rel-cat button[aria-current="true"]{background:var(--accent-soft)}
.rel-cat button:focus-visible{outline:2px solid var(--accent)}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.filtros .field{min-width:150px}
.rel-tbl{max-height:68vh;overflow:auto}.rel-tbl th{position:sticky;top:0;z-index:2}.rel-tbl td{white-space:nowrap}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}.pcard h4{margin:0 0 8px;font-family:var(--f-display);font-size:18px;font-weight:600}
.cons{border:1px solid var(--line);border-radius:8px;padding:12px 12px}.cons.best{border-color:var(--accent)}
.sim-note{font-size:12px;opacity:.75;line-height:1.3}
@media (max-width:767.98px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rel-wrap{grid-template-columns:1fr}.rel-cat{display:none}.rel-sel{display:block}.sim-note{display:none}.pcards{grid-template-columns:1fr}}
.tbl-wrap>table>tbody>tr>td:first-child,.tbl-wrap>table>thead>tr>th:first-child{position:sticky;left:0;z-index:1}
.tbl-wrap>table>tbody>tr>td:first-child{background:var(--surface)}.tbl-wrap>table>tbody>tr:hover>td:first-child{background:var(--surface-2)}
.tbl-wrap>table>tbody>tr.grp>td:first-child{background:var(--surface-2)}
.wk th,.wk td{padding:8px 8px}
th.w{white-space:normal}.pw .pill{white-space:normal}
.cmp{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;background:var(--surface-2)}.cmp-h{margin-bottom:8px}
/* ===== v5 · identidade NTN: verde-limão da marca, papel #ECECE3, tipografia Unbounded + Atkinson Hyperlegible ===== */
:root{
  --bg:#ECECE3; --surface:#FBFBF7; --surface-2:#F2F2EA; --line:#D7D8CB; --ink:#1C1E17; --ink-2:#4A4D41; --muted:#727566;
  --lime:#ADD91C; --lime-ink:#1C1E17; --accent:#4C6A0A; --accent-ink:#FFFFFF; --accent-soft:#E5F0C2;
  --side:#1F2119; --side-ink:#C4C8B2; --side-active:#FFFFFF;
  --good:#5E8C12; --warn:#D99A0B; --serious:#D16F2A; --crit:#BF3A22;
  --good-soft:#E3EFCC; --warn-soft:#F8ECCB; --serious-soft:#F7E2D2; --crit-soft:#F6DDD6;
  --s1:#7AA215; --s2:#2F6F78; --s3:#D49A12; --s4:#8A5A9E; --s5:#C2553A; --s6:#4E7FB8; --s7:#A3A86A; --s8:#5B5E52;
  --shadow:0 16px 48px rgba(31,33,25,.07);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15170F; --surface:#1D2016; --surface-2:#252A1C; --line:#353A2A; --ink:#EDEEE4; --ink-2:#C0C4AE; --muted:#8D917C;
  --accent:#B8E03A; --accent-ink:#15170F; --accent-soft:#2D3816; --side:#101209; --side-ink:#AEB39B;
  --good-soft:#26341A; --warn-soft:#3A3115; --serious-soft:#3B2618; --crit-soft:#3D1F19;
  --s1:#A6CF2B; --s2:#4FA3AD; --s3:#E1AE33; --s4:#B488C7; --s5:#E07A5F; --s6:#79A6DB; --s7:#C3C78A; --s8:#9A9D8E;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15170F; --surface:#1D2016; --surface-2:#252A1C; --line:#353A2A; --ink:#EDEEE4; --ink-2:#C0C4AE; --muted:#8D917C;
  --accent:#B8E03A; --accent-ink:#15170F; --accent-soft:#2D3816; --side:#101209; --side-ink:#AEB39B;
  --good-soft:#26341A; --warn-soft:#3A3115; --serious-soft:#3B2618; --crit-soft:#3D1F19;
  --s1:#A6CF2B; --s2:#4FA3AD; --s3:#E1AE33; --s4:#B488C7; --s5:#E07A5F; --s6:#79A6DB; --s7:#C3C78A; --s8:#9A9D8E;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark }
body{font-size:14px;line-height:1.5;font-feature-settings:"tnum" 0}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums lining-nums;font-size:14px;letter-spacing:0}
/* marca e menu */
.side{padding:24px 16px}
.brand{align-items:center;gap:12px}
.brand b{font-size:23px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:1px}
.brand b::before{content:"";display:none}
.brand b i{color:var(--lime)}
.brand small{text-transform:none;letter-spacing:0;font-size:12px;opacity:.65;line-height:1.2}
.nav button{border-radius:999px;padding:8px 16px;font-size:14px}
.nav button[aria-current="true"]{background:var(--lime);color:var(--lime-ink);font-weight:600}
.nav button[aria-current="true"] .badge{background:var(--lime-ink);color:var(--lime)}
.nav button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.side-foot label{text-transform:none;letter-spacing:0;font-size:12px;opacity:.75}
.side-foot select{border-radius:var(--r-sm)}
/* títulos */
.topline h1{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.015em;line-height:1.15}
.proto{text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;border-style:solid;color:var(--muted)}
.ola{margin:-8px 0 16px;max-width:72ch}
.ola p{margin:0;font-size:18px;line-height:1.5;color:var(--ink-2)}
.ola p b{color:var(--ink);font-weight:600}
.ola .tudo-ok{color:var(--good)}
/* rótulos em caixa normal (sem caixa-alta espaçada) */
th,.kpi span,.field label,.lbl,.facts div span,.kpi-g,.rel-g,.sec-t,.grp-mini{text-transform:none;letter-spacing:0}
th{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.kpi-g{font-size:14px;font-weight:600;color:var(--ink);margin:8px 0 8px}
.sec-t{font-size:14px;font-weight:600;color:var(--accent)}
.field label,.lbl{font-size:12px;color:var(--ink-2);font-weight:600}
.facts div span{font-size:12px;color:var(--muted)}
.rel-g{font-size:12px;font-weight:600}
.grp-mini{font-size:12px;font-family:var(--f-body)}
/* indicadores */
.kpi{border-radius:var(--r-md);padding:16px 16px;gap:4px;border-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.kpi span{font-size:14px;color:var(--ink-2);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:29px;font-weight:600;letter-spacing:-.02em}
.kpi.alert{box-shadow:inset 3px 0 0 var(--crit),inset 0 0 0 1px var(--line)}
.kpi.alert b{color:var(--crit)}
.kpi[data-act]:hover{box-shadow:inset 0 0 0 2px var(--accent)}
/* superfícies */
.panel{border-radius:var(--r-md)}
.panel-h h3{font-size:16px;font-weight:600}
.note{border-radius:var(--r-sm);background:transparent;border-color:var(--line);border-style:dashed;color:var(--ink-2)}
.banner{border-radius:var(--r-sm)}
.modal .box{border-radius:var(--r-lg)}
.modal .box header{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.drawer-top h2{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.015em}
.toast{border-radius:var(--r-md)}
/* controles */
.btn,.inp,select.inp,textarea.inp{border-radius:var(--r-sm)}
.btn{font-weight:600}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.primary:hover{background:#9CC613;border-color:#9CC613}
.btn:hover{border-color:var(--ink-2)}
.btn.ghost{color:var(--accent)}
.seg{border-radius:999px;padding:3px;gap:2px;background:var(--surface-2)}
.seg button{border-radius:999px;padding:8px 12px}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(31,33,25,.06)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--lime);border-bottom-width:3px}
.inp:focus,.btn:focus-visible,.seg button:focus-visible{outline-color:var(--accent)}
a{color:var(--accent)}
/* pessoas: avatares com cor própria */
.av{--h:90;flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.02em;
  background:hsl(var(--h) 45% 86%);color:hsl(var(--h) 45% 24%)}
.av.p{width:22px;height:22px;font-size:12px}
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 55% 82%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 55% 82%)}}
td.nm.com-av>.av-row{display:flex;align-items:center;gap:12px}
td.nm.com-av .av-txt{display:block;min-width:0}
.card .t.com-av{display:flex;align-items:center;gap:8px}
.drawer .avatar{width:54px;height:54px;font-size:18px}
/* quadro */
.col{border-radius:var(--r-md);background:color-mix(in srgb,var(--surface-2) 70%,var(--bg))}
.col-h b{font-size:14px}
.card{border-radius:10px}
.card.kreq{border-left-color:var(--lime);border-left-width:4px}
.chip{font-family:var(--f-body);font-size:12px;border-radius:999px;padding:1px 8px}
.pill{font-size:12px}
/* obras */
.obra{border-radius:var(--r-md)}
.obra h3{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.obra .big{font-family:var(--f-display);font-size:36px;letter-spacing:-.02em}
tr.grp td{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:-.005em}
.cellbtn.good{background:var(--good-soft)}
.hg.sel{background:var(--accent-soft)}
@media (max-width:767.98px){.topline h1{font-size:23px}.ola p{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v5.1 · seletor de tema */
.tema{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.tema-l{font-size:12px;opacity:.75;margin-top:8px}
.tema button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:28px;padding:0 4px;border:0;border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:12px;opacity:.78;cursor:pointer}
.tema button svg{width:13px;height:13px;flex:none}
.tema button:hover{opacity:1;background:rgba(255,255,255,.08)}
.tema button[aria-checked="true"]{background:var(--lime);color:#1C1E17;opacity:1;font-weight:600}
.tema button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
@media (max-width:767.98px){.tema{margin:0}.tema-l,.tema button span{display:none}.tema button{padding:0 8px;min-height:30px}}

/* ================= v6 · usabilidade ================= */
:root{--alvo:44px;--m-entra:200ms;--m-sai:150ms;--danger:#B42318}
:root[data-theme="dark"]{--danger:#F97066}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--danger:#F97066}}

/* tipografia: três pesos (400/500/600), nada acima de 600 */
b,strong,th,h1,h2,h3,h4,h5,h6,summary{font-weight:600}
body{line-height:1.5}

/* texto corrido não passa de ~75 caracteres por linha */
main p,.note,.banner,.ola-resumo,.sub{max-width:75ch}
.rel-tbl .note,td .note{max-width:none}

/* alvos de toque: 44px */
.btn,.btn.small,select.inp,input.inp:not([type=checkbox]):not([type=radio]),.nav button,.seg button,.tabs button,.th-sort,.menu>summary,.tema button,.x-btn,.menu-btn{min-height:var(--alvo);box-sizing:border-box}
select,textarea,input,.inp,.nbtn,.bnav,.q{box-sizing:border-box}
select,select.inp,textarea,textarea.inp{min-width:var(--alvo)}
select,textarea,input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=file]){min-height:var(--alvo);min-width:var(--alvo)}
.th-sort,.nbtn{min-width:var(--alvo)}
.nbtn{min-height:var(--alvo)}
.bnav{min-width:var(--alvo)!important;min-height:var(--alvo)!important}
.btn.ico,.x-btn{min-width:var(--alvo);justify-content:center;padding-inline:0}
.btn.small{padding-block:4px}
.th-sort{display:inline-flex;align-items:center}
label.inline-chk,label:has(> input[type=checkbox]){min-height:var(--alvo);display:inline-flex;align-items:center;gap:8px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.q{position:relative;width:24px!important;height:24px!important;font-size:12px!important}
.q::after{content:"";position:absolute;inset:-10px}
td a,td span[data-act],td .lnk{position:relative}
td a::after,td .lnk::after{content:"";position:absolute;inset:-14px -4px}

/* nada abaixo de 12px */
.badge,.sim-note,.chip,.av,.av.p,.tema button,.tema-l,.proto,small{font-size:12px!important}
.av{width:32px;height:32px}
.av.p{width:26px;height:26px}

/* metadados estáticos sem "pílula" decorativa; status coloridos continuam */
.pill:not(.good):not(.warn):not(.serious):not(.crit):not(.info){background:transparent;border-color:transparent;padding-inline:0;color:var(--ink-2)}
.pill:not(.good):not(.warn):not(.serious):not(.crit):not(.info)::before{display:none}
.chip:not(.ok):not(.no){background:transparent;border-color:transparent;padding-inline:0}
.proto{border:0;padding:0;background:none;color:var(--muted)}

/* rótulos visíveis em filtros e busca */
.fl{display:inline-flex;flex-direction:column;gap:4px;min-width:0}
.fl-t{font-size:12px;font-weight:500;color:var(--ink-2);line-height:1.4}
.toolbar{align-items:flex-end}
.toolbar .fl .search,.busca-lista .search{min-width:min(320px,100%)}
.busca-lista{margin:0 0 16px}
.obrig{color:var(--danger);font-weight:600}

/* erros de campo */
.ferr{margin:4px 0 0;font-size:14px;line-height:1.5;color:var(--danger);font-weight:500}
.inp[aria-invalid="true"]{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.rasc-aviso{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}

/* painéis: lateral (tarefas) e diálogo central (confirmação destrutiva) */
.modal{position:fixed;inset:0;z-index:60;display:block;padding:0}
.modal .scrim{position:absolute;inset:0;background:rgba(15,17,12,.45)}
.modal .box{position:absolute;display:flex;flex-direction:column;max-height:none;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal .box header{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 24px;border-bottom:1px solid var(--line)}
.modal .box header h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.01em;flex:1;min-width:0}
.modal .box .bd{flex:1;overflow-y:auto;padding:24px}
.modal .box footer{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface)}
.x-btn{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:var(--alvo);height:var(--alvo);border-radius:var(--r-sm);font-size:23px;line-height:1.1;color:var(--ink-2);cursor:pointer}
.x-btn:hover{background:var(--surface-2);color:var(--ink)}
.x-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal.sheet .box{top:0;right:0;bottom:0;width:min(480px,100%);border-radius:var(--r-lg) 0 0 var(--r-lg);border-right:0;animation:entraLado var(--m-entra) ease-out}
.modal.sheet.sheet-wide .box{width:min(960px,100%)}
.modal.dlg{display:grid;place-items:center;padding:16px}
.modal.dlg .box{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);border-radius:var(--r-lg);animation:entraDlg var(--m-sai) ease-out}
.modal.dlg .box header h2{font-size:18px}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover{filter:brightness(.95)}
@keyframes entraLado{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes entraDlg{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
/* um painel por vez: a ficha sai de cena enquanto um painel de tarefa está aberto */
#layer:has(> .modal) > .drawer,#layer:has(> .modal) > .scrim{display:none}
.drawer{border-left:1px solid var(--line)}
@media (max-width:767.98px){.modal.sheet .box,.modal.sheet.sheet-wide .box{width:100%;border-radius:0;border-left:0}}

/* dica (tooltip) */
.dica{position:fixed;z-index:200;max-width:280px;padding:8px 8px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;pointer-events:none;animation:aparece var(--m-sai) ease-out}
.dica kbd,kbd{font-family:var(--f-body);font-size:12px;padding:0 4px;border:1px solid currentColor;border-radius:4px;opacity:.85}
@keyframes aparece{from{opacity:0}to{opacity:1}}

/* estados vazios */
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;text-align:center;color:var(--ink-2)}
.vazio b{color:var(--ink);font-size:16px}
.vazio span{font-size:14px;max-width:56ch}
.vazio .btn{margin-top:4px}

/* linhas clicáveis: nome em cor de link + seta, foco visível */
tr.lin-click{cursor:pointer}
tr.lin-click > td:first-child .av-txt, tr.lin-click > td.nm:first-child:not(.com-av){color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
tr.lin-click > td:first-child .av-txt > *{display:inline-block;width:100%;color:var(--muted)}
tr.lin-click > td:last-child::after{content:"›";float:right;color:var(--muted);font-size:18px;line-height:1.1;margin-left:8px}
tr.lin-click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.lin-click:hover td{background:var(--surface-2)}

/* pular para o conteúdo */
.pular{position:absolute;left:8px;top:-60px;z-index:300;background:var(--lime);color:var(--lime-ink);padding:12px 16px;border-radius:var(--r-sm);font-weight:600}
.pular:focus{top:8px}

/* menu no celular */
.menu-btn{display:none}
@media (max-width:767.98px){
  .side{overflow:visible;flex-wrap:wrap;padding:8px 16px;gap:8px}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:0 12px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer}
  .menu-btn svg{width:20px;height:20px}
  .side .nav,.side .side-foot{display:none}
  body.menu-aberto .side .nav{display:flex;flex-direction:column;width:100%;order:3}
  body.menu-aberto .side .side-foot{display:flex;flex-direction:column;align-items:stretch;width:100%;order:4;padding:8px 0 16px}
  body.menu-aberto .nav button span.l{display:inline}
  body.menu-aberto .side-foot label,body.menu-aberto .tema-l{display:block}
  body.menu-aberto .tema button span{display:inline}
}

/* movimento: só transform/opacity; reduzido = sem deslocamento */
@media (prefers-reduced-motion:reduce){
  .modal.sheet .box,.modal.dlg .box,.drawer{animation:aparece var(--m-sai) linear!important}
}
/* abas segmentadas: uma linha, rolagem interna quando não couber */
.seg{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.seg button{white-space:nowrap;flex:none;padding-inline:12px}
/* seletor de tema cabe no menu */
.tema{width:100%;box-sizing:border-box}
.tema button{min-width:0;padding:0 4px;gap:4px}

/* ================= v7 ================= */
.autoria{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:14px;color:var(--ink-2);padding:8px 0}
.drawer-h .autoria{padding:8px 0 0}
.autoria b{color:var(--ink);font-weight:500}
.aud-det summary{cursor:pointer;color:var(--accent);min-height:var(--alvo);display:flex;align-items:center}
.aud-det ul{margin:4px 0 0;padding-left:16px;font-size:14px;max-width:56ch}
.passos{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 16px;counter-reset:p}
.passos li{counter-increment:p;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.passos li::before{content:counter(p) " · "}
.passos li.atual{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:600}
.passos li.feito{color:var(--ink)}
fieldset.modo,fieldset.aval-q{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px 12px;margin:0;min-width:0}
fieldset.modo legend,fieldset.aval-q legend{font-weight:600;font-size:14px;padding:0 4px}
fieldset.modo .inline-chk{align-items:flex-start;padding:8px 0}
.aval{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.aval-t{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.estrelas{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.est{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:var(--alvo);min-height:var(--alvo);padding:4px 8px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;text-align:center;max-width:120px}
.est input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.est span{color:var(--warn);font-size:16px;letter-spacing:1px;line-height:1.2}
.est.alt span{color:var(--ink);font-size:14px;font-weight:500}
.est small{font-size:12px;color:var(--muted);line-height:1.3}
.est:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.est:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.aval-box .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.aval-box .facts div{display:flex;flex-direction:column;gap:2px}
.aval-box .facts span{font-size:12px;color:var(--muted)}
.aval-box .facts small{font-size:14px;color:var(--ink-2)}
.hh-graf{width:100%;min-width:320px;height:auto;display:block}
.hh-graf .b-plan{fill:var(--s2,#2F6F78)}
.hh-graf .b-norm{fill:var(--s1,#7AA215)}
.hh-graf .b-ext{fill:var(--s3,#D49A12)}
.hh-graf text{font-size:11px;fill:var(--muted)}
.hh-graf .eixo{stroke:var(--line)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 12px}
.lg-plan{background:var(--s2,#2F6F78)}.lg-norm{background:var(--s1,#7AA215)}.lg-ext{background:var(--s3,#D49A12)}

.modal.dlg .box.wide{width:min(880px,100%)}
.modal.dlg .box.wide .est{flex:1 1 88px}
/* ================= v8 ================= */
.decide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.decide .dc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.decide .dc span{font-size:14px;font-weight:600;color:var(--ink-2)}
.decide .dc b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.decide .dc b.dc-t{font-family:var(--f-body);font-size:16px;line-height:1.4}
.decide .dc small{font-size:12px;color:var(--muted);line-height:1.4}
.decide .dc.crit{box-shadow:inset 3px 0 0 var(--crit)}.decide .dc.crit b{color:var(--crit)}
.decide .dc.warn{box-shadow:inset 3px 0 0 var(--warn)}
.lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-size:12px}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:767.98px){.decide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ret-hosp{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;margin:0;display:flex;flex-direction:column;gap:4px}
.ret-hosp legend{font-weight:600;font-size:14px;padding:0 4px}
.lbl-n{font-size:14px;line-height:1.5}
td.neg{color:var(--crit);font-weight:600}
.rel-wrap.cat-off{grid-template-columns:1fr}.rel-wrap.cat-off .rel-cat{display:none}
.rel-tbl{max-height:70vh;overflow:auto}
.rel-tbl thead th{position:sticky;top:0;z-index:1;background:var(--surface-2)}

/* v9 · celular: cartões no lugar de tabelas, quadro por coluna, abas que quebram linha */
.board-sel{display:none}
.obra .pill.warn{margin-left:6px}
@media (max-width:767.98px){
  .tbl-wrap:has(> table.cardable){overflow:visible;border:0;background:none}
  table.cardable{min-width:0!important;width:100%;border:0}
  table.cardable thead{display:none}
  table.cardable,table.cardable tbody,table.cardable tr{display:block;width:100%}
  table.cardable tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 12px;background:var(--surface)}
  table.cardable tr:hover{background:var(--surface)}
  table.cardable td{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:10px;align-items:start;border:0!important;padding:5px 0!important;text-align:left!important;white-space:normal!important;min-height:0;width:auto!important}
  table.cardable td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:12.5px;line-height:1.35}
  table.cardable td:not([data-label]),table.cardable td[data-label=""],table.cardable td.td-full{grid-template-columns:1fr}
  table.cardable td:empty{display:none}
  table.cardable td .btn,table.cardable td > .pill,table.cardable td > .chip{justify-self:start}
  table.cardable td > .inp,table.cardable td > select{width:100%;max-width:none}
  .board-sel{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;font-size:13px;color:var(--muted)}
  .board{flex-direction:column;overflow:visible}
  .board > .col{flex:1 1 auto;width:100%;max-height:none}
  .board > .col:not(.m-on){display:none}
  .tabs{flex-wrap:wrap;overflow:visible}
  .seg{flex-wrap:wrap!important;overflow:visible;border-radius:14px}
}

/* v10 · aviso de virada do dia, seleção por toque e grade do histograma */
.virada-aviso{position:fixed;left:16px;right:16px;bottom:16px;z-index:200;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px;max-width:720px;margin:0 auto}
[data-act="hgIntervalo"][aria-pressed="true"]{outline:2px solid currentColor;outline-offset:1px}
.hgt th:first-child,.hgt td.nm{position:sticky;left:0;z-index:1;background:var(--surface)}
@media (max-width:767.98px){
  table.cardable td{grid-template-columns:minmax(96px,38%) minmax(0,1fr)}
  table.cardable td > *{min-width:0;overflow-wrap:anywhere}
  table.cardable td .pill{white-space:normal;height:auto}
}

/* v11 */
@media (max-width:767.98px){.so-desk{display:none}}
.so-mob{display:none}@media (max-width:767.98px){.so-mob{display:inline}}
@media (min-width:768px){aside.side{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}

.side-foot label[for="perfil"],.side-foot #perfil{display:none!important}

.usuario .u-acoes button:hover{background:rgba(255,255,255,.08)}

    if(c.status==='Admissão'||c.status==='Desligado')return;

  reqTreinos(c,obraId).forEach(t=>{const v=treinoVal(c,t);if(!v)p.push(`${curto(t)} não realizado`);else if(v<d)p.push(v<hoje?`${curto(t)} vencida em ${fmt(v)}`:`${curto(t)} vence em ${fmt(v)}`)});

}
function aptidao(c){

  reqTreinos(c).forEach(t=>{const v=treinoVal(c,t);if(v){const d=dias(v);if(d>=0&&d<=45)w.push(curto(t)+' vence em '+d+'d')}});
  return {ok:!p.length,pend:p,warn:w,cor:p.length?'crit':w.length?'warn':'good'};
}
function sema(c){const a=aptidao(c);const lab=a.cor==='crit'?'Bloqueado':a.cor==='warn'?'Apto, vencendo':'Apto';const col={crit:'var(--crit)',warn:'var(--warn)',good:'var(--good)'}[a.cor];return `<span class="sema" title="${esc(a.pend.concat(a.warn).join(' · '))}"><i style="background:${col}"></i>${lab}</span>`}
function gateOkBase(c,req){

function benValor(c,b){return b.valor!=null&&b.valor!==''?+b.valor:benPadrao(c,b)}

function alertasBase(){
  const out=[];const A=DB.cfg.antecedencia;
  DB.colabs.forEach(c=>{

    if(c.tipoContrato?.startsWith('Experiência')&&c.admissao){const f1=addD(c.admissao,44),f2=addD(c.admissao,89);
      if(dias(f1)>=0)out.push({c,tipo:'Experiência',desc:'Fim do 1º período de experiência (45 dias)',data:f1});
      else if(dias(f2)>=-3)out.push({c,tipo:'Experiência',desc:'Fim do contrato de experiência (90 dias) — efetivar ou encerrar',data:f2});}
    if(c.aso?.validade)out.push({c,tipo:'ASO',desc:'ASO periódico',data:c.aso.validade});
    reqTreinos(c).forEach(t=>{const v=treinoVal(c,t);if(!v)out.push({c,tipo:'Treinamento',desc:t.nome+' — não realizado',data:hoje,falta:true});else out.push({c,tipo:'Treinamento',desc:t.nome,data:v})});
    const fl=feriasLimite(c);if(fl&&c.status!=='Férias'&&dias(addM(c.admissao,(c.ferias.gozadas+1)*12))<=0&&!(c.ausencias||[]).some(a=>a.tipo==='Férias'&&a.inicio>hoje))out.push({c,tipo:'Férias',desc:'Limite para conceder férias (depois paga em dobro)',data:fl});

    (c.ausencias||[]).filter(a=>a.inicio<=hoje&&(!a.fim||a.fim>=hoje)).forEach(a=>{
      if(!a.fim)out.push({c,tipo:'Retorno',desc:`${a.tipo}: data de retorno a confirmar`,data:hoje,falta:true});
      else out.push({c,tipo:'Retorno',desc:`Retorno de ${a.tipo.toLowerCase()}${a.confirmado?'':' (a confirmar)'}${a.tipo==='Afastamento'&&dias(a.inicio)<=-29?' — agendar ASO de retorno':''}`,data:addD(a.fim,1)});
    });
  });

/* ============ planejamento de efetivo ============ */
function celula(o,f,d,inc=UI.planRasc){
  const ni=necInfo(o,f,d,inc);const nec=ni.v;const necs=ni.partes;
  const aloc=[],ind=[],pend=[],lib=[],prev=[];
  DB.colabs.forEach(c=>{
    if(c.funcaoId!==f)return;
    if(ativoEm(c,d)&&obraEm(c,d)===o){const it={c,aus:ausenteEm(c,d),p:pendenciasEm(c,d,o)};aloc.push(it);if(it.aus.length)ind.push(it);else if(it.p.length)pend.push(it);else lib.push(it)}
    if(c.status==='Admissão'&&c.obraId===o&&(!c.previsaoInicio||c.previsaoInicio<=d))prev.push({c,tipo:'Admissão em andamento',quando:c.previsaoInicio,conf:!!c.previsaoInicio,p:pendenciasEm(c,d,o)});
    const pr=c.alocacoes.find(a=>a.status==='proposta'&&a.obraId===o&&a.inicio<=d);
    if(pr&&ativoEm(c,d))prev.push({c,tipo:'Transferência proposta',quando:pr.inicio,conf:true,de:obraEm(c,d),p:pendenciasEm(c,d,o)});
  });
  const L=lib.length;
  return {o,f,d,nec,necs,aloc,ind,pend,lib,prev,prevConf:prev.filter(x=>x.conf).length,prevAconf:prev.filter(x=>!x.conf).length,def:nec==null?0:Math.max(0,nec-L),exc:nec==null?null:Math.max(0,L-nec),cob:nec?Math.round(L/nec*100):null,naoPlanejado:nec==null};
}
function pares(d1,d2){
  const s=new Set();
  (DB.hist||[]).forEach(r=>{if(!(r.status==='Aprovada'||(UI.planRasc&&['Rascunho','Em aprovação'].includes(r.status))))return;Object.entries(r.cel||{}).forEach(([f,ws])=>{if(Object.entries(ws).some(([w,v])=>v!=null&&v!==''&&w<=d2&&addD(w,6)>=d1))s.add(r.obraId+'|'+f)})});
  DB.colabs.forEach(c=>{if(c.status==='Desligado'&&c.desligamento?.data<=d1)return;[d1,d2].forEach(d=>{if(ativoEm(c,d)){const o=obraEm(c,d);if(o&&O(o)?.tipo!=='Administrativo')s.add(o+'|'+c.funcaoId)}})});
  const fo=restrito()?DB.cfg.obras[0].id:UI.planObra;
  return [...s].map(k=>k.split('|')).filter(([o,f])=>O(o)&&(!fo||o===fo)&&(!UI.planFuncao||f===UI.planFuncao))
    .sort((a,b)=>DB.cfg.obras.findIndex(x=>x.id===a[0])-DB.cfg.obras.findIndex(x=>x.id===b[0])||DB.cfg.funcoes.findIndex(x=>x.id===a[1])-DB.cfg.funcoes.findIndex(x=>x.id===b[1]));
}
function piorNaJanela(o,f,d1,n){let pior=null;for(let i=0;i<=n;i++){const x=celula(o,f,addD(d1,i));if(!pior||x.def>pior.def)pior=x}return pior}
function acoesDe(o,f){
  const t=(DB.tarefas||[]).filter(x=>x.status==='Aberta'&&x.obraId===o&&x.funcaoId===f).map(x=>({tipo:x.tipo,resp:x.responsavel,prazo:x.prazo,desc:x.descricao}));

  DB.colabs.forEach(c=>c.alocacoes.forEach(a=>{if(a.status==='proposta'&&a.obraId===o&&c.funcaoId===f)t.push({tipo:'Transferência proposta',resp:'Diretoria',prazo:a.inicio,desc:`${c.nome} de ${nomeObra(obraEm(c,hoje))}`})}));

/* ============ transferências ============ */
function transferir(c,obraId,data,motivo,status='programada'){
  const de=obraEm(c,data)||c.obraId;
  if(status==='proposta'){
    c.alocacoes=c.alocacoes.filter(a=>a.status!=='proposta');
    c.alocacoes.push({obraId,inicio:data,fim:null,motivo:'Transferência – '+motivo,status:'proposta'});
    c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta: ${nomeObra(de)} → ${nomeObra(obraId)} a partir de ${fmt(data)} (aguarda aprovação). Motivo: ${motivo}.`,autor:perfilNome()});
  }else{
    c.alocacoes=c.alocacoes.filter(a=>!(a.status!=='proposta'&&a.inicio>=data&&a.inicio>hoje));
    const v=vigente(c,data);if(v){v.fim=data}
    c.alocacoes.push({obraId,inicio:data,fim:null,motivo:'Transferência – '+motivo,status:data>hoje?'programada':undefined});
    if(/operação/.test(O(obraId)?.tipo||''))c.peric=true;
    c.historico.push({data:data>hoje?hoje:data,tipo:'Transferência',texto:`${data>hoje?'Programada: ':''}${nomeObra(de)} → ${nomeObra(obraId)}${data>hoje?' a partir de '+fmt(data):''}. Motivo: ${motivo}.`,autor:perfilNome()});
  }
  c.alocacoes.sort((a,b)=>a.inicio.localeCompare(b.inicio));
  save();
}
function aprovarTransf(c,ok){
  const p=c.alocacoes.find(a=>a.status==='proposta');if(!p)return;
  c.alocacoes=c.alocacoes.filter(a=>a!==p);
  if(ok){const d=p.inicio<hoje?hoje:p.inicio;transferir(c,p.obraId,d,p.motivo.replace('Transferência – ',''),'programada');c.historico.push({data:hoje,tipo:'Transferência',texto:`Transferência para ${nomeObra(p.obraId)} aprovada.`,autor:perfilNome()})}
  else c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta de transferência para ${nomeObra(p.obraId)} recusada.`,autor:perfilNome()});
  save();
}

let dragId=null;
function bindDnD(){
  document.querySelectorAll('.card[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
  });
  document.querySelectorAll('.col[data-board]').forEach(cl=>{
    cl.addEventListener('dragover',e=>{e.preventDefault();cl.classList.add('over')});
    cl.addEventListener('dragleave',e=>{if(!cl.contains(e.relatedTarget))cl.classList.remove('over')});
    cl.addEventListener('drop',e=>{e.preventDefault();cl.classList.remove('over');if(dragId)moveCard(dragId,cl.dataset.board,cl.dataset.col);dragId=null});
  });
}
function moveCardBase(id,board,val){
  const c=C(id);if(!c)return;
  if(board==='etapa'){
    if(c.etapa===val)return;
    const et=DB.cfg.etapas;const from=et.findIndex(e=>e.id===c.etapa),to=et.findIndex(e=>e.id===val);
    const pend=[];if(to>from)for(let i=Math.max(from,0);i<to;i++){const g=gateOk(c,et[i].req);if(g)pend.push(`${et[i].nome}: ${g}`)}
    c.etapa=val;c.etapaDesde=hoje;c.historico.push({data:hoje,tipo:'Admissão',texto:`Etapa: ${et[from]?.nome||'—'} → ${et[to].nome}.`+(pend.length?` Avançou com pendências (${pend.join('; ')}).`:''),autor:perfilNome()});
    save();render();pend.length?toast('Movido com pendências — '+pend.join(' · '),true):toast(`${c.nome.split(' ')[0]} agora está em "${et[to].nome}".`);
  }else if(board==='status'){
    if(c.status===val){render();return}
    modalStatus(c,val);
  }else if(board==='obra'){
    if(c.obraId===val){render();return}modalTransfer(c,val);
  }
}

/* ============ modais ============ */
let modalSubmit=null;
function modal(title,body,okLabel,onSubmit,wide){
  closeModal();const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="scrim" data-act="closeModal"></div><form class="box ${wide?'wide':''}" style="position:relative;z-index:1"><header>${title}</header><div class="bd form">${body}</div><footer><button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">${okLabel}</button></footer></form>`;
  $('#layer').appendChild(d);modalSubmit=onSubmit;d.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(modalSubmit(fd)!==false)closeModal()});
  d.querySelector('input:not([type=checkbox]),select,textarea')?.focus();
}
function modalInfo(title,body,wide=true){
  closeModal();const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="box ${wide?'wide':''}" style="position:relative;z-index:1" role="dialog" aria-label="${esc(title.replace(/<[^>]+>/g,''))}"><header>${title}</header><div class="bd">${body}</div><footer><button type="button" class="btn primary" data-act="closeModal">Fechar</button></footer></div>`;
  $('#layer').appendChild(d);d.querySelector('footer .btn').focus();
}
function closeModal(){document.querySelectorAll('#layer .modal').forEach(m=>m.remove())}

  modal(`Transferir ${esc(c.nome)} · #${c.matricula}`,`<div class="field full"><label>De</label><div>${esc(nomeObra(c.obraId))}</div></div>
   <div class="field"><label for="m-o">Para</label><select class="inp" id="m-o" name="obra">${opts.map(o=>`<option value="${o.id}" ${o.id===dest?'selected':''}>${esc(o.nome)}</option>`).join('')}</select></div>
   ${fld('A partir de','data',pre.data||hoje,'date')}
   <div class="field"><label for="m-st">Situação</label><select class="inp" id="m-st" name="status">${podeProgramar()?`<option value="programada" ${stDef==='programada'?'selected':''}>Programada (aprovada)</option>`:''}<option value="proposta" ${stDef==='proposta'?'selected':''}>Proposta (aguarda aprovação)</option></select></div>
   <div class="field"><label for="m-m">Motivo</label><select class="inp" id="m-m" name="motivo">${['Reforço de equipe','Fim da frente de serviço','Solicitação do cliente','Solicitação do colaborador','Remanejamento de função'].map(m=>`<option>${m}</option>`).join('')}</select></div>
   <div class="note full">Data futura: a pessoa continua contando na obra atual até a data. Proposta não muda nada até ser aprovada; no destino ela aparece como cobertura prevista. Confira a integração do novo cliente e as NRs exigidas na obra de destino.</div>`,'Salvar transferência',fd=>{
    if(fd.data<hoje){toast('Use a data de hoje ou futura. Para corrigir o passado, ajuste o histórico de alocações.',true);return false}

function modalStatus(c,pre){
  const tipos=['Férias','Folga de campo','Afastamento','Outra ausência'];
  const pt=pre==='Afastado'?'Afastamento':pre==='Ativo'?'Ativo':tipos.includes(pre)?pre:'Férias';
  const pf=proximaFolga(c);
  modal('Registrar ausência ou retorno',`<div class="field"><label for="m-s">Tipo</label><select class="inp" id="m-s" name="tipo"><option value="Ativo" ${pt==='Ativo'?'selected':''}>Retorno ao trabalho (encerrar ausência atual)</option>${tipos.map(s=>`<option ${s===pt?'selected':''}>${s}</option>`).join('')}</select></div>
   ${fld('Início','ini',pt==='Folga de campo'&&pf?pf.inicio:hoje,'date')}${fld('Último dia de ausência','fim',pt==='Folga de campo'&&pf?pf.fim:'','date')}
   <div class="field"><label for="m-cf">Retorno</label><select class="inp" id="m-cf" name="conf"><option value="0">Previsto</option><option value="1">Confirmado</option></select></div>
   <div class="field full"><label for="m-ob">Observação</label><input class="inp" id="m-ob" name="obs" placeholder="Ex.: férias – 1º período de 14 dias"></div>
