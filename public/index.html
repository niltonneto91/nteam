/* ---------- calendário e prazos ---------- */
function feriadosObra(o){return new Set((DB.cfg.feriados||[]).concat(O(o)?.feriados||[]))}
function isUtil(d,fs){const w=parse(d).getDay();return w!==0&&w!==6&&!fs.has(d)}
function subPrazo(d,n,tipo,o){if(tipo!=='uteis')return addD(d,-n);const fs=feriadosObra(o);let x=d,k=0;while(k<n){x=addD(x,-1);if(isUtil(x,fs))k++}return x}
function addPrazo(d,n,tipo,o){if(tipo!=='uteis')return addD(d,n);const fs=feriadosObra(o);let x=d,k=0;while(k<n){x=addD(x,1);if(isUtil(x,fs))k++}return x}
const PRAZO_PADRAO={contratacao:15,transferencia:5,remobilizacao:7,tipoDias:'corridos',responsavel:'Analista de RH',alertas:[7,3],escalonar:2,gestor:'Diretoria',porFuncao:{},custoMobilizacao:0};
function prazoCfg(o){const ob=O(o);if(!ob)return PRAZO_PADRAO;ob.prazos=Object.assign({},PRAZO_PADRAO,ob.prazos||{});return ob.prazos}
function prazoDe(o,f,tipo='contratacao'){const p=prazoCfg(o);const pf=p.porFuncao?.[f]?.[tipo];return {dias:+(pf??p[tipo]??0),tipoDias:p.tipoDias||'corridos',origem:pf!=null&&pf!==''?'específico da função':'padrão da obra',tipo}}
const prazoTxt=p=>`${p.dias} dias ${p.tipoDias==='uteis'?'úteis':'corridos'}`;

/* ---------- histograma ---------- */
function frentesObra(o){const f=O(o)?.frentes;return f&&f.length?f:['Geral']}
function revsDe(o,fr){return (DB.hist||[]).filter(r=>r.obraId===o&&(fr==null||r.frente===fr))}
function rascunhoDe(o,fr){return revsDe(o,fr).find(r=>r.status==='Rascunho'||r.status==='Em aprovação')}
function vigentes(o,fr,inc){const ap=revsDe(o,fr).filter(r=>r.status==='Aprovada').sort((a,b)=>b.num-a.num);if(inc){const dr=rascunhoDe(o,fr);if(dr)ap.unshift(dr)}return ap}
function valRev(r,f,d){const w=segunda(d);let v=r.cel?.[f]?.[w];if(v===undefined||v==='')v=null;const aj=(r.ajustes||[]).filter(a=>a.f===f&&a.data<=d&&segunda(a.data)===w).sort((a,b)=>a.data.localeCompare(b.data)).pop();if(aj)v=aj.qtd;return v==null?null:+v}
function necInfo(o,f,d,inc=UI.planRasc){const partes=[];frentesObra(o).forEach(fr=>{const r=vigentes(o,fr,inc).find(x=>x.vigencia<=d);if(r)partes.push({frente:fr,v:valRev(r,f,d),rev:r})});const def=partes.filter(p=>p.v!=null);return {v:def.length?def.reduce((s,p)=>s+p.v,0):null,partes,parcial:def.length>0&&def.length<partes.filter(p=>p.rev.cel?.[f]).length}}
const necEm=(o,f,d,inc)=>necInfo(o,f,d,inc).v;
function necOriginal(o,f,d){let t=null;frentesObra(o).forEach(fr=>{const r=revsDe(o,fr).filter(x=>x.status==='Aprovada').sort((a,b)=>a.num-b.num)[0];if(r&&r.vigencia<=d){const v=valRev(r,f,d);if(v!=null)t=(t||0)+v}});return t}
function hospEst(o,d){let t=null;frentesObra(o).forEach(fr=>{const r=vigentes(o,fr,false).find(x=>x.vigencia<=d);const v=r?.hosp?.[segunda(d)];if(v!=null&&v!=='')t=(t||0)+(+v)});return t}
function novaRevisao(o,fr,vig,just){
  const ap=vigentes(o,fr,false);const base=ap.find(r=>r.vigencia<=vig)||ap[0];
  const num=Math.max(0,...revsDe(o,fr).map(r=>r.num))+1;
  const r={id:uid(),obraId:o,frente:fr,num,status:'Rascunho',vigencia:vig,autor:perfilNome(),criada:hoje,justificativa:just||'',baseNum:base?.num||null,
    cel:base?JSON.parse(JSON.stringify(base.cel)):{},ajustes:base?JSON.parse(JSON.stringify(base.ajustes||[])):[],hosp:base?Object.assign({},base.hosp||{}):{},
    regra:JSON.parse(JSON.stringify(prazoCfg(o))),hist:[{data:hoje,autor:perfilNome(),texto:`Revisão ${num} criada${base?' a partir da revisão '+base.num:''}. Vigência a partir de ${fmt(vig)}.${just?' '+just:''}`}]};
  DB.hist.push(r);return r;
}
function diffRev(r){const base=revsDe(r.obraId,r.frente).find(x=>x.num===r.baseNum);const out=[];const fs=new Set(Object.keys(r.cel).concat(base?Object.keys(base.cel):[]));
  fs.forEach(f=>{const ws=new Set(Object.keys(r.cel[f]||{}).concat(base?Object.keys(base.cel[f]||{}):[]));ws.forEach(w=>{if(w<segunda(r.vigencia))return;const a=base?.cel?.[f]?.[w];const b=r.cel?.[f]?.[w];const na=a==null||a===''?null:+a,nb2=b==null||b===''?null:+b;if(na!==nb2)out.push({f,w,de:na,para:nb2})})});
  const ka=JSON.stringify(base?.ajustes||[]),kb=JSON.stringify(r.ajustes||[]);if(ka!==kb)out.push({f:'',w:'',de:'ajustes',para:'alterados'});
  return out.sort((a,b)=>a.w.localeCompare(b.w));}

/* ---------- efetivo projetado ---------- */
function alocProj(o,f,d){let n=0;for(const c of DB.colabs){if(c.funcaoId===f&&ativoEm(c,d)&&obraEm(c,d)===o)n++}return n}
function obrasOper(){return DB.cfg.obras.filter(o=>o.status==='Ativa'&&o.tipo!=='Administrativo')}
function funcoesPlanejadas(o){return DB.cfg.funcoes.filter(f=>revsDe(o).some(r=>r.status==='Aprovada'&&r.cel[f.id]&&Object.values(r.cel[f.id]).some(v=>v!=null&&v!=='')))}

/* ---------- mobilização ---------- */
function demandasMob(H=140){
  const out=[];
  obrasOper().forEach(o=>funcoesPlanejadas(o.id).forEach(f=>{let prev=0;
    for(let i=0;i<=H;i++){const d=addD(hoje,i);const n=necEm(o.id,f.id,d,false);if(n==null)continue;const g=Math.max(0,n-alocProj(o.id,f.id,d));if(g>prev)out.push({obraId:o.id,funcaoId:f.id,inicio:d,qtd:g-prev,nec:n});prev=g}
  }));
  return out;
}
function procsDe(m){
  const l=DB.colabs.filter(c=>c.mobKey===m.key).map(c=>({c,tipo:'Admissão',done:c.status!=='Admissão'&&!!c.admissao&&c.admissao<=hoje,inicioReal:c.status!=='Admissão'?c.admissao:null,prev:c.status==='Admissão'?previsaoAdm(c):c.admissao}));
  DB.colabs.forEach(c=>c.alocacoes.forEach(a=>{if(a.mobKey===m.key)l.push({c,a,tipo:a.status==='proposta'?'Transferência proposta':'Transferência',done:a.status==='executada'&&a.inicio<=hoje,inicioReal:a.status==='executada'?a.inicio:null,prev:a.inicio})}));
  return l;
}
function restanteEtapas(c){const et=DB.cfg.etapas;const i=Math.max(0,et.findIndex(e=>e.id===c.etapa));const decor=c.etapaDesde?Math.max(0,-dias(c.etapaDesde)):0;let tot=0,grp=0;
  for(let k=i;k<et.length;k++){let d=+et[k].dias||0;if(k===i)d=Math.max(0,d-decor);if(et[k].paralelo&&k>i)grp=Math.max(grp,d);else{tot+=grp;grp=d}}return tot+grp}
function previsaoAdm(c){const p=prazoCfg(c.obraId);return addPrazo(hoje,restanteEtapas(c),p.tipoDias,c.obraId)}
function nivelAlerta(m){const da=dias(m.abertura);const p=prazoCfg(m.obraId);const al=(p.alertas||[]).map(Number).sort((a,b)=>b-a);
  if(da<0)return -da>=(+p.escalonar||2)?'Escalado ao gestor':'Abertura atrasada';if(da===0)return 'Vencimento hoje';const hit=al.filter(x=>da<=x).pop();return hit!=null?`Alerta ${hit} dias antes`:null}
function syncMob(motivo){
  DB.mobs??=[];const dem=demandasMob();const keys=new Set();const log=[];
  dem.forEach(x=>{const k=x.obraId+'|'+x.funcaoId+'|'+x.inicio;keys.add(k);
    let m=DB.mobs.find(y=>y.key===k&&!['Cancelado','Substituído'].includes(y.final));
    if(!m){const p=prazoDe(x.obraId,x.funcaoId,'contratacao');
      m={id:uid(),key:k,obraId:x.obraId,funcaoId:x.funcaoId,inicio:x.inicio,qtd:x.qtd,tipo:'contratacao',regra:p,abertura:subPrazo(x.inicio,p.dias,p.tipoDias,x.obraId),criada:hoje,final:'',excecao:null,alerta:null,
        hist:[{data:hoje,texto:`Criada: ${x.qtd} ${F(x.funcaoId).nome.toLowerCase()} para início em ${fmt(x.inicio)}; prazo ${prazoTxt(p)} (${p.origem}); abertura até ${fmt(subPrazo(x.inicio,p.dias,p.tipoDias,x.obraId))}.${motivo?' Origem: '+motivo+'.':''}`}]};
      if(m.abertura<hoje){m.insuf=true;m.viavel=addPrazo(hoje,p.dias,p.tipoDias,x.obraId);m.hist.push({data:hoje,texto:`Prazo padrão insuficiente: início solicitado em ${fmt(x.inicio)}; primeira data estimada viável em ${fmt(m.viavel)}.`})}
      DB.mobs.push(m);log.push(`${F(m.funcaoId).nome} · ${nomeObra(m.obraId)}: nova mobilização de ${m.qtd} para ${fmt(m.inicio)} (abrir até ${fmt(m.abertura)})${m.insuf?' — prazo insuficiente':''}`);
    }else{
      if(m.qtd!==x.qtd){m.hist.push({data:hoje,texto:`Quantidade ${m.qtd} → ${x.qtd}${motivo?' ('+motivo+')':''}.`});log.push(`${F(m.funcaoId).nome} · ${nomeObra(m.obraId)} em ${fmt(m.inicio)}: ${m.qtd} → ${x.qtd}`);m.qtd=x.qtd}
      if(m.revisada){m.revisada=false;m.hist.push({data:hoje,texto:'Necessidade voltou a existir após revisão.'})}
      if(m.final==='Concluído'&&!procsDe(m).every(p=>p.done)){m.final=''}
    }
  });
  // vincular processos já abertos (sem duplicar)
  const abertas=DB.mobs.filter(m=>!m.final).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  abertas.forEach(m=>{let falta=m.qtd-procsDe(m).length;if(falta<=0)return;
    DB.colabs.filter(c=>c.status==='Admissão'&&c.obraId===m.obraId&&c.funcaoId===m.funcaoId&&(!c.mobKey||!DB.mobs.some(y=>y.key===c.mobKey&&!y.final))).forEach(c=>{if(falta>0){c.mobKey=m.key;falta--;m.hist.push({data:hoje,texto:`Processo vinculado automaticamente: ${c.nome}.`})}});
    DB.colabs.forEach(c=>{if(c.funcaoId!==m.funcaoId)return;c.alocacoes.forEach(a=>{if(falta>0&&a.status==='proposta'&&a.obraId===m.obraId&&!a.mobKey){a.mobKey=m.key;falta--;m.hist.push({data:hoje,texto:`Transferência proposta vinculada: ${c.nome}.`})}})});
  });
  DB.mobs.forEach(m=>{
    if(m.final)return;const ps=procsDe(m);
    if(!keys.has(m.key)){
      if(ps.length&&ps.every(p=>p.done)){m.final='Concluído';m.inicioReal=ps.map(p=>p.inicioReal).sort().pop();m.hist.push({data:hoje,texto:`Concluída: início efetivo confirmado em ${fmt(m.inicioReal)}.`});log.push(`${F(m.funcaoId).nome} · ${nomeObra(m.obraId)}: mobilização concluída`)}
      else if(ps.length){if(!m.revisada){m.revisada=true;m.hist.push({data:hoje,texto:'Necessidade coberta ou revisada; processo em andamento mantido (não é cancelado automaticamente).'})}}
      else{m.final='Cancelado';m.hist.push({data:hoje,texto:'Cancelada: necessidade revisada ou coberta, sem processo aberto.'+(motivo?' '+motivo+'.':'')});log.push(`${F(m.funcaoId).nome} · ${nomeObra(m.obraId)} em ${fmt(m.inicio)}: mobilização cancelada (necessidade revisada)`)}
      return}
    const nv=nivelAlerta(m);if(nv&&nv!==m.alerta&&procsDe(m).length<m.qtd){m.alerta=nv;m.hist.push({data:hoje,texto:`${nv} enviado a ${prazoCfg(m.obraId).responsavel}${nv==='Escalado ao gestor'?' e '+prazoCfg(m.obraId).gestor:''}.`})}
    const r=prazoDe(m.obraId,m.funcaoId,m.tipo);m.regraMudou=r.dias!==m.regra.dias||r.tipoDias!==m.regra.tipoDias?r:null;
  });
  if(log.length)(DB.mobLog??=[]).push({data:hoje,autor:perfilNome(),motivo:motivo||'Recalculo',itens:log});
  return log;
}
function mobSit(m){
  if(m.final==='Concluído')return {s:'Concluído',cls:'good'};
  if(m.final==='Cancelado')return {s:'Cancelado',cls:'plain'};
  if(m.final==='Substituído')return {s:'Substituído',cls:'plain'};
  const ps=procsDe(m);const n=ps.length;
  if(n>=m.qtd){const prev=ps.map(p=>p.prev).filter(Boolean).sort().pop();const risco=prev&&prev>m.inicio;return {s:risco?'Em risco':'Em andamento no prazo',cls:risco?'crit':'info',prev,risco}}
  const da=dias(m.abertura);const al=Math.max(0,...(prazoCfg(m.obraId).alertas||[7]).map(Number));
  let s=da<0?'Abertura atrasada':da===0?'Início devido hoje':da<=al?'A iniciar':'Planejado';const cls=da<0?'crit':da<=al?'warn':'plain';
  return {s:s+(n?` · ${n}/${m.qtd} com processo`:''),cls,esc:da<0&&-da>=(+prazoCfg(m.obraId).escalonar||2),prev:ps.map(p=>p.prev).filter(Boolean).sort().pop()};
}
function abrirProcesso(m,n){
  const fn=F(m.funcaoId);const o=m.obraId;const q=Math.max(1,n);
  for(let i=1;i<=q;i++){const c=novoRegistro({nome:`Vaga em aberto – ${fn.nome} (${i}/${q})`,tel:'',funcao:m.funcaoId,obra:o,prev:m.inicio,regime:'Alojado',vinculo:'CLT',origem:'planejamento'});c.mobKey=m.key;c.etapaDesde=hoje;DB.colabs.push(c)}
  m.realAbertura=m.realAbertura||hoje;m.hist.push({data:hoje,texto:`Processo aberto por ${perfilNome()}: ${q} vaga(s) no quadro de Admissões.`});
}

/* ---------- hospedagem ---------- */
function leitosDe(h){return h.quartos.flatMap(q=>q.leitos.map(l=>({h,q,l})))}
function acharLeito(id){for(const h of DB.hospedagens||[])for(const q of h.quartos)for(const l of q.leitos)if(l.id===id)return {h,q,l};return null}
const leitoNome=id=>{const x=acharLeito(id);return x?`${x.h.codigo} · ${x.q.nome} · ${x.l.nome}`:'—'};
const bloqueadoEm=(it,d)=>(it.bloqueios||[]).find(b=>b.inicio<=d&&(!b.fim||b.fim>=d));
const ehHotel=h=>h.tipo==='Hotel'||h.tipo==='Pousada';
function quartoContratado(h,q,d){return !ehHotel(h)||(q.contratadoDe&&q.contratadoDe<=d&&(!q.contratadoAte||q.contratadoAte>=d))}
function unidadeOperacional(h,d){if(h.situacao==='Encerrado'||h.situacao==='Bloqueado')return false;if(h.situacao==='Em preparação'&&(!h.disponivelEm||h.disponivelEm>d))return false;if(h.contratoInicio&&d<h.contratoInicio)return false;if(h.contratoFim&&d>h.contratoFim)return false;return !bloqueadoEm(h,d)}
function motivoIndisp(h,q,l,d){if(!unidadeOperacional(h,d))return bloqueadoEm(h,d)?.motivo||(h.contratoFim&&d>h.contratoFim?'fora do contrato':h.situacao);if(!quartoContratado(h,q,d))return 'quarto não contratado na data';const b=bloqueadoEm(q,d)||bloqueadoEm(l,d);return b?b.motivo:''}
function leitoOperacional(h,q,l,d){return !motivoIndisp(h,q,l,d)}
const estConta=e=>['Reservada','Ocupada','Encerrada'].includes(e.situacao);
const entradaDe=e=>e.entradaReal||e.entradaPrev;const saidaDe=e=>e.saidaReal||e.saidaPrev||'';
const noite=(e,d)=>entradaDe(e)<=d&&(!saidaDe(e)||d<saidaDe(e));
function estadiasLeito(lid){return (DB.estadias||[]).filter(e=>e.leitoId===lid&&estConta(e))}
function capOp(h,d){const n=leitosDe(h).filter(x=>leitoOperacional(h,x.q,x.l,d)).length;return h.capValidada?Math.min(n,+h.capValidada):n}
function ocupacao(h,d,obraId){const ids=new Set(leitosDe(h).map(x=>x.l.id));const es=(DB.estadias||[]).filter(e=>ids.has(e.leitoId)&&estConta(e)&&noite(e,d)&&(!obraId||e.obraId===obraId));
  const occ=es.filter(e=>e.situacao!=='Reservada').length,res=es.filter(e=>e.situacao==='Reservada').length;const tot=leitosDe(h).filter(x=>!ehHotel(h)||quartoContratado(h,x.q,d)).length;const cap=capOp(h,d);
  return {cap,occ,res,livres:Math.max(0,cap-occ-res),bloq:Math.max(0,tot-leitosDe(h).filter(x=>leitoOperacional(h,x.q,x.l,d)).length),tot,es}}
function hospDaObra(o){return (DB.hospedagens||[]).filter(h=>(h.obraIds||[]).includes(o))}
function ts(d,h){const [H,M]=(h||'00:00').split(':').map(Number);return parse(d).getTime()+H*36e5+(M||0)*6e4}
function intervaloEst(e){return [ts(entradaDe(e),e.horaEntrada||'14:00'),saidaDe(e)?ts(saidaDe(e),e.horaSaida||'10:00'):Infinity]}
function onde(c,d){return (DB.estadias||[]).find(e=>e.colabId===c.id&&estConta(e)&&noite(e,d))}
function validarEstadia(e){
  const erros=[],avisos=[];const c=C(e.colabId);
  if(!c)erros.push('Selecione o colaborador.');
  if(!entradaDe(e))erros.push('Informe a data de entrada.');
  if(saidaDe(e)&&saidaDe(e)<entradaDe(e))erros.push('A saída precisa ser depois da entrada.');
  if(erros.length)return {erros,avisos};
  const [s,en]=intervaloEst(e);
  const ativas=['Solicitada','Reservada','Ocupada'];
  (DB.estadias||[]).forEach(x=>{if(x.id===e.id||x.colabId!==e.colabId||!ativas.includes(x.situacao)||!ativas.includes(e.situacao))return;const [a,b]=intervaloEst(x);if(a<en&&s<b)erros.push(`Duplicidade: ${c.nome.split(' ')[0]} já tem estadia ${x.situacao.toLowerCase()} de ${fmt(entradaDe(x))} a ${saidaDe(x)?fmt(saidaDe(x)):'(sem saída)'}${x.leitoId?' em '+leitoNome(x.leitoId):''}.`)});
  if(['Reservada','Ocupada'].includes(e.situacao)){
    const L=acharLeito(e.leitoId);if(!L){erros.push('Escolha o quarto e o leito para reservar ou ocupar.');return {erros,avisos}}
    const {h,q,l}=L;const buf=(+h.preparoHoras||0)*36e5;
    estadiasLeito(l.id).forEach(x=>{if(x.id===e.id)return;const [a,b]=intervaloEst(x);if(a<en+buf&&s<b+buf)erros.push(`Conflito no leito ${l.nome}: ${C(x.colabId)?.nome||'outro hóspede'} de ${fmt(entradaDe(x))} a ${saidaDe(x)?fmt(saidaDe(x)):'(sem saída)'}${buf?` (+${h.preparoHoras}h de preparação)`:''}.`)});
    const fimChk=saidaDe(e)?addD(saidaDe(e),-1):addD(entradaDe(e),120);
    for(let d=entradaDe(e),k=0;d<=fimChk&&k<370;d=addD(d,1),k++){const m=motivoIndisp(h,q,l,d);if(m){erros.push(`Leito indisponível em ${fmt(d)}: ${m}.`);break}
      const oc=ocupacao(h,d);const ja=oc.es.some(x=>x.id===e.id);if(oc.occ+oc.res+(ja?0:1)>oc.cap){erros.push(`Superlotação em ${fmt(d)}: capacidade operacional de ${h.codigo} é ${oc.cap}.`);break}}
    if(c&&q.sexo&&q.sexo!=='Misto'&&c.sexo&&q.sexo!==c.sexo)erros.push(`${NR24.split(' (')[0]} 24.7.2 d: dormitórios separados por sexo (quarto ${q.sexo.toLowerCase()}).`);
    if(c&&q.turno&&q.turno!=='Qualquer'&&c.turno&&q.turno!==c.turno)avisos.push('NR-24 24.7.4: trabalhadores do mesmo quarto devem, preferencialmente, ser do mesmo turno.');
    if(!(h.obraIds||[]).includes(e.obraId))avisos.push('Esta hospedagem não está vinculada à obra informada.');
  }
  return {erros,avisos};
}
function salvarEstadia(e,texto){
  const v=validarEstadia(e);if(v.erros.length){toast(v.erros[0],true);return null}
  DB.estadias??=[];const ex=DB.estadias.find(x=>x.id===e.id);
  e.hist??=[];e.hist.push({data:hoje,autor:perfilNome(),texto:texto||(ex?'Estadia atualizada.':'Estadia registrada.')});
  if(ex)Object.assign(ex,e);else{e.id=e.id||uid();e.autor=e.autor||perfilNome();e.criada=e.criada||hoje;DB.estadias.push(e)}
  const c=C(e.colabId);if(c)c.historico.push({data:hoje,tipo:'Hospedagem',texto:`${e.situacao}: ${e.leitoId?leitoNome(e.leitoId):'hospedagem a definir ('+nomeObra(e.obraId)+')'} · entrada ${fmt(entradaDe(e))}${saidaDe(e)?' · saída '+fmt(saidaDe(e)):''}.${texto?' '+texto:''}`,autor:perfilNome()});
  if(v.avisos.length)toast(v.avisos[0],true);
  return e;
}
function leitosLivresOpts(obraId,d,sel,sexo){
  return hospDaObra(obraId).filter(h=>h.situacao!=='Encerrado').flatMap(h=>leitosDe(h)).map(({h,q,l})=>{const ind=motivoIndisp(h,q,l,d);const oc=estadiasLeito(l.id).find(e=>noite(e,d));const inc=sexo&&q.sexo&&q.sexo!=='Misto'&&q.sexo!==sexo;
    return `<option value="${l.id}" ${sel===l.id?'selected':''} ${ind||oc||inc?'disabled':''}>${esc(h.codigo)} · ${esc(q.nome)} · ${esc(l.nome)}${ind?' — '+esc(ind):oc?' — ocupado/reservado':inc?' — quarto '+esc(q.sexo.toLowerCase()):' — livre'}</option>`}).join('');
}
function custoDia(h,d,obraId){
  if(h.contratoInicio&&d<h.contratoInicio)return 0;if(h.contratoFim&&d>h.contratoFim)return 0;if(h.situacao==='Encerrado'&&h.encerradoEm&&d>=h.encerradoEm)return 0;
  const extra=(+h.despesas||0)/30;let v=0;
  if(h.cobranca==='imovel_mes')v=(+h.valor||0)/30+extra;
  else if(h.cobranca==='quarto_diaria')v=h.quartos.filter(q=>quartoContratado(h,q,d)).length*(+h.valor||0)+extra;
  else v=ocupacao(h,d).occ*(+h.valor||0)+extra;
  if(obraId&&(h.obraIds||[]).length>1){const oc=ocupacao(h,d);const t=oc.occ+oc.res;const mine=ocupacao(h,d,obraId);v=t?v*(mine.occ+mine.res)/t:v/(h.obraIds.length)}
  return v;
}
function custoPeriodo(h,d1,d2,obraId){let inc=0,proj=0;for(let d=d1;d<=d2;d=addD(d,1)){const v=custoDia(h,d,obraId);if(d<hoje)inc+=v;else proj+=v}return {inc,proj}}
const custoMensal=h=>h.cobranca==='imovel_mes'?(+h.valor||0)+(+h.despesas||0):custoDia(h,hoje)*30;

/* ---------- remanejamento entre obras ---------- */
function serieObra(o,f,H){const r=[];for(let i=0;i<=H;i++){const d=addD(hoje,i);const n=necEm(o,f,d,false);const a=alocProj(o,f,d);r.push({d,n,a,ex:n==null?null:a-n})}return r}
function movsAbertas(c){return c.alocacoes.filter(a=>a.status==='proposta'||(a.status==='programada'&&a.inicio>hoje))}
function oportunidades(H=90){
  const out=[];const obras=obrasOper();
  DB.cfg.funcoes.forEach(f=>{
    const S={};obras.forEach(o=>S[o.id]=serieObra(o.id,f.id,H));
    obras.forEach(B=>{const sb=S[B.id];let i=0,segs=0;
      while(i<=H&&segs<3){
        if(!(sb[i].ex!=null&&sb[i].ex<0)){i++;continue}
        let j=i;while(j+1<=H&&sb[j+1].ex!=null&&sb[j+1].ex<0)j++;segs++;
        const s=i,e=j,need=-sb[i].ex;
        obras.forEach(A=>{if(A.id===B.id)return;const sa=S[A.id];
          const okAt=k=>sa[k].ex!=null&&sa[k].ex>=1;
          let algum=false;for(let k=0;k<=e;k++)if(okAt(k)){algum=true;break}if(!algum)return;
          const pt=prazoDe(B.id,f.id,'transferencia');const lim=subPrazo(sb[s].d,pt.dias,pt.tipoDias,B.id);const li=Math.max(0,Math.min(e,dias(lim)));
          let L=li;if(okAt(li))while(L-1>=0&&okAt(L-1))L--;
          let quebra=null,naoPlan=null;for(let k=li;k<=e;k++){if(sa[k].ex==null){naoPlan=naoPlan??k;continue}if(sa[k].ex<1){quebra=k;break}}
          const minEx=(a,b)=>{let m=Infinity;for(let k=a;k<=b;k++)if(sa[k].ex!=null)m=Math.min(m,sa[k].ex);return m===Infinity?0:m};
          let status,motivo,ret=null,qtd=0,cls,fimCob=e;
          if(dias(lim)<0&&!okAt(0)){status='Inviável';cls='crit';motivo=`A data-limite de saída (${fmt(lim)}) já passou e a origem não tem excedente hoje.`}
          else if(!okAt(li)){let k=li;while(k<=e&&!okAt(k))k++;status='Inviável';cls='crit';motivo=k<=e?`A origem só libera em ${fmt(sa[k].d)}; para começar em ${fmt(sb[s].d)} a saída precisa ser até ${fmt(lim)} (transferência: ${prazoTxt(pt)}).`:`A origem não tem excedente antes de ${fmt(sb[e].d)}.`}
          else if(quebra!=null){fimCob=quebra-1;if(fimCob>=s){status='Temporária';cls='warn';ret=sa[quebra].d;qtd=Math.min(need,minEx(li,fimCob));motivo=`A origem volta a precisar em ${fmt(sa[quebra].d)}. Cobre o destino de ${fmt(sb[s].d)} a ${fmt(sa[fimCob].d)}; depois disso o destino volta a ter déficit.`}
            else{status='Inviável';cls='crit';motivo=`Bloqueada: a origem ficaria descoberta em ${fmt(sa[quebra].d)}, antes de o destino ser atendido.`}}
          else{qtd=Math.min(need,minEx(li,e));status=naoPlan!=null?'Viável · avaliação parcial':'Viável';cls=naoPlan!=null?'warn':'good';if(e<H)ret=addD(sb[e].d,1);
            motivo=naoPlan!=null?`Origem sem histograma a partir de ${fmt(sa[naoPlan].d)}: viabilidade parcialmente avaliada.`:e<H?`O destino precisa até ${fmt(sb[e].d)}; retorno pode ser programado para ${fmt(ret)}.`:`Necessidade do destino segue além de ${fmt(sb[H].d)} (horizonte).`}
          const exist=[];DB.colabs.forEach(c=>{if(c.funcaoId!==f.id)return;c.alocacoes.forEach(a=>{if(a.obraId===B.id&&(a.status==='proposta'||(a.status==='programada'&&a.inicio>hoje))&&(obraEm(c,addD(a.inicio,-1))===A.id||a.origemId===A.id))exist.push({c,a})})});
          out.push({id:`${f.id}|${A.id}|${B.id}|${sb[s].d}`,f:f.id,A:A.id,B:B.id,s:sb[s].d,e:sb[e].d,need,dispDe:okAt(li)?sa[L].d:null,lim,pt,qtd,status,cls,motivo,ret,fimCob:sa[Math.max(0,fimCob)]?.d,
            saldo:qtd?minEx(li,quebra!=null?quebra-1:e)-qtd:null,naoPlan:naoPlan!=null,exist,intervalo:okAt(li)?Math.round((parse(sb[s].d)-parse(sa[L].d))/864e5):null});
        });
        i=j+1;
      }
    });
  });
  const ord={'Viável':0,'Viável · avaliação parcial':1,'Temporária':2,'Inviável':3};
  return out.sort((a,b)=>ord[a.status]-ord[b.status]||a.s.localeCompare(b.s));
}
function candidatosOp(op){
  const fimJ=op.ret?addD(op.ret,-1):op.e;
  return DB.colabs.filter(c=>c.funcaoId===op.f&&ativoEm(c,op.lim<hoje?hoje:op.lim)&&obraEm(c,op.lim<hoje?hoje:op.lim)===op.A).map(c=>{
    const aus=[];for(let d=op.lim<hoje?hoje:op.lim;d<=fimJ;d=addD(d,7))ausenteEm(c,d).forEach(a=>{if(!aus.includes(a))aus.push(a)});ausenteEm(c,fimJ).forEach(a=>{if(!aus.includes(a))aus.push(a)});
    const p=pendenciasEm(c,op.s,op.B);const conf=movsAbertas(c);
    const livreDest=Math.min(...[op.s,addD(op.s,7),fimJ].map(d=>hospDaObra(op.B).reduce((s,h)=>s+ocupacao(h,d).livres,0)));
    return {c,aus,p,conf,livreDest,hospOrig:onde(c,hoje),ok:!aus.length&&!conf.length&&!p.length};
  }).sort((a,b)=>(b.ok-a.ok)||(a.conf.length-b.conf.length)||(a.aus.length-b.aus.length)||(a.p.length-b.p.length));
}
function checarOrigem(c,data,retorno){
  const o=obraEm(c,data)||c.obraId;const f=c.funcaoId;const fim=retorno?addD(retorno,-1):addD(data,90);const prob=[];let naoPlan=false;
  for(let d=data;d<=fim;d=addD(d,1)){const n=necEm(o,f,d,false);if(n==null){naoPlan=true;continue}const a=alocProj(o,f,d);if(a-1<n){prob.push({d,n,a});if(prob.length>60)break}}
  return {o,prob,naoPlan};
}

function sincronizar(){
  DB.colabs.forEach(c=>{
    c.sexo??=(/^(Juliana|Aline|Camila|Ana|Patrícia|Mariana)\b/.test(c.nome)?'Feminino':'Masculino');c.turno??='Diurno';
    c.alocacoes.forEach(a=>{a.aid??=uid()});
    if(c.status==='Admissão'){c.etapaDesde??=hoje;return}
    if(c.status==='Desligado')return;
    const v=vigente(c,hoje);if(v){c.obraId=v.obraId;if(v.status==='programada'&&v.inicio<=hoje){v.status='executada';v.dataReal??=v.inicio}}
    const a=(c.ausencias||[]).filter(x=>x.inicio<=hoje&&(!x.fim||x.fim>=hoje));
    c.status=a.length?STATUS_AUS[a[0].tipo]:'Ativo';
  });
}
function transferirBase(c,obraId,data,motivo,status='programada',op={}){
  const de=obraEm(c,data)||c.obraId;const ret=op.retorno||'';
  if(status==='proposta'){
    c.alocacoes=c.alocacoes.filter(a=>a.status!=='proposta');
    c.alocacoes.push({aid:uid(),obraId,inicio:data,fim:ret||null,motivo:'Transferência – '+motivo,status:'proposta',origemId:de,retorno:ret,hospOp:op.hospOp||'',leito:op.leito||'',mobKey:op.mobKey||'',criada:hoje});
    c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta: ${nomeObra(de)} → ${nomeObra(obraId)} a partir de ${fmt(data)}${ret?` com retorno em ${fmt(ret)}`:' sem retorno programado'} (aguarda aprovação). Motivo: ${motivo}.`,autor:perfilNome()});
    save();return;
  }
  const v=vigente(c,data);const fimAnterior=v?v.fim:null;if(v)v.fim=data;
  const dest={aid:uid(),obraId,inicio:data,fim:ret||null,motivo:'Transferência – '+motivo,status:data>hoje?'programada':'executada',dataReal:data<=hoje?data:null,origemId:de,retorno:ret,mobKey:op.mobKey||'',aprovadoPor:perfilNome(),aprovadoEm:hoje};
  c.alocacoes.push(dest);
  if(ret)c.alocacoes.push({aid:uid(),obraId:de,inicio:ret,fim:fimAnterior,motivo:'Retorno de transferência temporária',status:'programada',retornoDe:dest.aid});
  if(/operação/.test(O(obraId)?.tipo||''))c.peric=true;
  c.alocacoes.sort((a,b)=>a.inicio.localeCompare(b.inicio));
  // hospedagem
  const atual=(DB.estadias||[]).find(e=>e.colabId===c.id&&['Ocupada','Reservada'].includes(e.situacao)&&noite(e,data<hoje?hoje:data));
  if(atual&&!(acharLeito(atual.leitoId)?.h.obraIds||[]).includes(obraId)){atual.saidaPrev=data;atual.motivoSaida=`Transferência para ${nomeObra(obraId)}`;atual.transfAid=dest.aid;atual.hist?.push({data:hoje,autor:perfilNome(),texto:`Saída prevista em ${fmt(data)} por transferência.`})}
  if(op.hospOp==='pendente')salvarEstadia({id:uid(),colabId:c.id,obraId,leitoId:'',entradaPrev:data,saidaPrev:ret||'',situacao:'Solicitada',motivoEntrada:'Transferência',transfAid:dest.aid},'Hospedagem pendente para a transferência.');
  if(op.hospOp==='reserva'&&op.leito)salvarEstadia({id:uid(),colabId:c.id,obraId,leitoId:op.leito,entradaPrev:data,saidaPrev:ret||'',situacao:data<=hoje?'Ocupada':'Reservada',entradaReal:data<=hoje?data:'',motivoEntrada:'Transferência',transfAid:dest.aid},'Reserva vinculada à transferência.');
  c.historico.push({data:data>hoje?hoje:data,tipo:'Transferência',texto:`${data>hoje?'Programada: ':''}${nomeObra(de)} → ${nomeObra(obraId)}${data>hoje?' a partir de '+fmt(data):''}${ret?`, retorno em ${fmt(ret)}`:''}. Motivo: ${motivo}.${op.excecao?' Exceção aprovada: '+op.excecao:''}`,autor:perfilNome()});
  save();
}
function aprovarTransf(c,ok,aid){
  const p=c.alocacoes.find(a=>a.status==='proposta'&&(!aid||a.aid===aid));if(!p)return;
  c.alocacoes=c.alocacoes.filter(a=>a!==p);
  if(ok){const d=p.inicio<hoje?hoje:p.inicio;transferir(c,p.obraId,d,p.motivo.replace('Transferência – ',''),'programada',{retorno:p.retorno,hospOp:p.hospOp,leito:p.leito,mobKey:p.mobKey});c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta para ${nomeObra(p.obraId)} aprovada e programada.`,autor:perfilNome()})}
  else c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta de transferência para ${nomeObra(p.obraId)} recusada.`,autor:perfilNome()});

function adiarTransf(c,aid,nova){

  let semanas=null;const toIso=s=>{const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(!m)return null;const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):hoje.slice(0,4);return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};

function sugestaoPrazo(){const g={};(DB.mobs||[]).filter(m=>m.final==='Concluído'&&m.inicioReal).forEach(m=>{const ab=m.realAbertura||procsDe(m).map(p=>p.c.historico.find(h=>h.tipo==='Requisição')?.data).filter(Boolean).sort()[0];if(!ab)return;const k=m.obraId+'|'+m.tipo;(g[k]??=[]).push(Math.round((parse(m.inicioReal)-parse(ab))/864e5))});

function projecaoHosp(o,n=12){
  const hs=hospDaObra(o);const w0=segunda(hoje);
  return [...Array(n)].map((_,i)=>{const w=addD(w0,i*7);const nights=[...Array(7)].map((_,k)=>addD(w,k));
    const cap=Math.min(...nights.map(d=>hs.reduce((s,h)=>s+capOp(h,d),0)));
    const nominal=Math.max(...nights.map(d=>hs.reduce((s,h)=>{const x=ocupacao(h,d,o);return s+x.occ+x.res},0)));
    const ests=(DB.estadias||[]).filter(e=>e.obraId===o&&e.situacao!=='Cancelada');
    const ent=ests.filter(e=>entradaDe(e)>=w&&entradaDe(e)<=addD(w,6)).length;const sai=ests.filter(e=>saidaDe(e)&&saidaDe(e)>=w&&saidaDe(e)<=addD(w,6));const saiC=sai.filter(e=>e.saidaReal||e.saidaConfirmada).length;
    const sol=Math.max(...nights.map(d=>ests.filter(e=>e.situacao==='Solicitada'&&noite(e,d)).length));
    const est=hospEst(o,w);const semNomes=est==null?0:Math.max(0,est-nominal-sol);
    const dem=nominal+sol+semNomes;const prevW=addD(w,-7);const necT=DB.cfg.funcoes.reduce((s,f)=>s+(necEm(o,f.id,w,false)||0),0),necP=DB.cfg.funcoes.reduce((s,f)=>s+(necEm(o,f.id,prevW,false)||0),0);
    const red=necT<necP?necP-necT:0;
    return {w,cap,nominal,ent,sai:sai.length,saiC,sol,est,semNomes,def:Math.max(0,dem-cap),ociosa:Math.max(0,cap-dem),red}});
}

function consolidar(obraId,H){
  const units=(DB.hospedagens||[]).filter(h=>(h.obraIds||[]).includes(obraId)&&!ehHotel(h)&&h.situacao==='Ativo');const fim=addD(hoje,H);const res=[];
  if(units.length<2)return res;
  units.forEach(U=>{
    const others=units.filter(x=>x!==U);
    const est=(DB.estadias||[]).filter(e=>estConta(e)&&e.situacao!=='Encerrada'&&units.includes(acharLeito(e.leitoId)?.h));
    const cands=[...new Set([addD(hoje,1)].concat(est.map(saidaDe).filter(Boolean)))].filter(d=>d>hoje&&d<=fim).sort();
    let found=null,motivo='';for(const D of cands){const r=tentarDesocupar(U,others,D,fim,obraId);if(r.ok){found=r;break}motivo=r.motivo}
    if(!found){res.push({U,ok:false,motivo:motivo||'sem data viável no horizonte'});return}
    let D=found.D;const aviso=+U.avisoDias||0;let avisar=addD(D,-aviso);
    if(avisar<hoje){D=addD(hoje,aviso);avisar=hoje;if(D>fim){res.push({U,ok:false,motivo:`Com aviso de ${aviso} dias, a devolução seria em ${fmt(D)}, fora do horizonte.`});return}const r2=tentarDesocupar(U,others,D,fim,obraId);if(!r2.ok){res.push({U,ok:false,motivo:`Com aviso de ${aviso} dias a devolução seria em ${fmt(D)}, mas ${r2.motivo}.`});return}found=r2}
    if(U.contratoFim&&U.contratoFim<=D){res.push({U,ok:false,motivo:`O contrato já termina em ${fmt(U.contratoFim)}.`});return}
    const mensal=U.valor?custoMensal(U):null;const fimEco=U.contratoFim||addD(D,180);const meses=Math.max(0,(parse(fimEco)-parse(D))/864e5/30);
    const mud=DB.cfg.custoMudanca!=null&&DB.cfg.custoMudanca!==''?found.moves.length*(+DB.cfg.custoMudanca):null;const multa=U.multa!=null&&U.multa!==''?+U.multa:null;
    const falta=[!mensal?'valor do contrato':'',mud==null?'custo de mudança':'',multa==null?'multa ou condições de devolução':''].filter(Boolean);
    res.push({U,ok:true,D,avisar,moves:found.moves,econ:{mensal,meses,mud,multa,liquido:mensal!=null?mensal*meses-(mud||0)-(multa||0):null,falta}});
  });
  return res;
}
function tentarDesocupar(U,others,D,fim,obraId){
  const fimX=addD(fim,1);
  const need=(DB.estadias||[]).filter(e=>estConta(e)&&e.situacao!=='Encerrada'&&acharLeito(e.leitoId)?.h===U&&(!saidaDe(e)||saidaDe(e)>D)&&entradaDe(e)<=fim);
  const beds=others.flatMap(h=>leitosDe(h)).map(b=>({...b,busy:(DB.estadias||[]).filter(e=>estConta(e)&&e.situacao!=='Encerrada'&&e.leitoId===b.l.id).map(e=>[entradaDe(e),saidaDe(e)||'9999-12-31'])}));
  const livre=(b,a,z)=>{for(const [x,y] of b.busy)if(x<z&&a<y)return false;for(let d=a;d<z&&d<=fim;d=addD(d,1))if(!leitoOperacional(b.h,b.q,b.l,d))return false;return true};
  need.sort((a,b)=>(saidaDe(b)||'9999').localeCompare(saidaDe(a)||'9999'));
  const moves=[];
  for(const e of need){const a=entradaDe(e)>D?entradaDe(e):D;const z0=saidaDe(e)||'9999-12-31';const z=z0<fimX?z0:fimX;const c=C(e.colabId);
    const opts=beds.filter(b=>livre(b,a,z)&&(!b.q.sexo||b.q.sexo==='Misto'||!c?.sexo||b.q.sexo===c.sexo)).sort((x,y)=>((x.q.turno===c?.turno)?0:1)-((y.q.turno===c?.turno)?0:1));
    if(!opts.length)return {ok:false,motivo:`não há leito livre e compatível para ${c?.nome||'um ocupante'} a partir de ${fmt(a)}${entradaDe(e)>D?' (reserva futura)':''}`};
    const b=opts[0];b.busy.push([a,z0]);moves.push({e,c,toLeito:b.l.id,a})}
  const sol=(DB.estadias||[]).filter(e=>e.situacao==='Solicitada'&&e.obraId===obraId);
  for(let d=D;d<=fim;d=addD(d,1)){const n=sol.filter(e=>noite(e,d)).length;if(!n)continue;const free=beds.filter(b=>leitoOperacional(b.h,b.q,b.l,d)&&!b.busy.some(([x,y])=>x<=d&&d<y)).length;if(free<n)return {ok:false,motivo:`em ${fmt(d)} faltariam vagas para ${n} pessoa(s) com hospedagem solicitada`}}
  return {ok:true,D,moves};
}

function chegadaColab(c){if(c.status!=='Admissão')return c.admissao||'';const a=previsaoAdm(c);const p=c.previsaoInicio||'';return p>a?p:a}

      const it={c,aus,p:pendenciasEm(c,d,o)};aloc.push(it);if(aus.length)ind.push(it);else if(it.p.length)pend.push(it);else lib.push(it)}

function paresCalc(d1,d2){

/* ---------- impacto de uma transferência na origem, dia a dia ---------- */
function impactoOrigem(c,saida,retorno,origem){

    const isLib=x.lib.some(y=>y.c===c);const isAloc=x.aloc.some(y=>y.c===c);const libD=x.lib.length-(isLib?1:0);const alocD=x.aloc.length-(isAloc?1:0);
    if(libD<x.nec)dias_.push({d,nec:x.nec,lib:x.lib.length,libD,aloc:x.aloc.length,alocD,falta:x.nec-libD,preexist:x.lib.length<x.nec,causa:isLib})}
  const pior=dias_.reduce((m,y)=>!m||y.falta>m.falta?y:m,null);
  return {o,f,saida,fim,dias:dias_,pior,primeiro:dias_[0]||null,naoPlan,total,ok:!dias_.length,ultimo:dias_[dias_.length-1]||null};

/* Compara, no MESMO período [de, ate]: custo de manter a unidade × custo de devolver e acomodar a demanda. */

function consolidar(obraId,H){

function tentarDesocupar(U,others,D,V,obraId){

    if(!opts.length){conflitos.push({e,c,desde:a,ate:z0==='9999-12-31'?'':z0,fimNoite:z,noites:Math.round((parse(z)-parse(a))/864e5),reserva:entradaDe(e)>D,motivo:`sem leito livre e compatível${c?.sexo?' ('+c.sexo.toLowerCase()+')':''} nas outras unidades de ${fmt(a)} a ${z0==='9999-12-31'?'(sem saída)':fmt(z0)}`});continue}
    const b=opts[0];b.busy.push([a,z0]);moves.push({e,c,toLeito:b.l.id,a,reserva:entradaDe(e)>D})}

    const freeOthers=beds.filter(b=>leitoOperacional(b.h,b.q,b.l,d)&&!b.busy.some(([x,y])=>x<=d&&d<y)).length;
    const freeHot=hs.filter(ehHotel).reduce((s,h)=>s+ocupacao(h,d).livres,0);

    dia[d]={sol:n,semNomes,conf,freeOthers,freeHot,semPlano:est==null,falta:Math.max(0,conf+n+semNomes-freeOthers-freeHot)};
    if(faltaGen>0){if(!cur||cur.ate!==addD(d,-1)){cur={desde:d,ate:d,max:faltaGen,noites:faltaGen,sol:n,semNomes};demanda.push(cur)}else{cur.ate=d;cur.max=Math.max(cur.max,faltaGen);cur.noites+=faltaGen}}

const PONTO_CAMPOS={faltas:{rot:'Faltas',un:'dias',int:true},atrasos:{rot:'Atrasos',un:'minutos',int:true},he50:{rot:'Horas extras 50%',un:'horas',dec:2},he100:{rot:'Horas extras 100%',un:'horas',dec:2}};
function calendarioComp(cp,c){

  for(let d=ini;d<=fim;d=addD(d,1)){if(c?.admissao&&d<c.admissao)continue;if(c?.desligamento&&d>c.desligamento.data)continue;const w=parse(d).getDay();if(w===0||fs.has(d))nu++;else if(w===6)sab++;else du++}

function validarPonto(c,cp,k,raw){

  const reqs=(DB.reqs||[]).filter(r=>reqAtiva(r)&&admFiltroOk(r.obraId,r.funcaoId)).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const cands=(DB.cands||[]).filter(x=>['Triagem','Entrevista','Teste prático'].includes(x.etapa)&&R(x.reqId)&&admFiltroOk(R(x.reqId).obraId,R(x.reqId).funcaoId));
  const cols=et.map(e=>{
    if(e.id==='e1'){const leg=adm.filter(c=>c.etapa==='e1');return colGen('etapa','e1','Requisições de vaga','vaga aprovada pelo RH e pelo gestor',reqs.map(cardReq).join('')+leg.map(c=>cardAdm(c)).join(''),reqs.length+leg.length)}
    if(e.id==='e2'){const leg=adm.filter(c=>c.etapa==='e2');const grp={};cands.forEach(x=>(grp[x.reqId]??=[]).push(x));
      return colGen('etapa','e2','Seleção','candidatos: só contato, entrevista e teste',Object.entries(grp).map(([rid,l])=>`<div class="grp-mini">${esc(R(rid).num)} · ${esc(F(R(rid).funcaoId).nome)} · ${esc(obraCurta(R(rid).obraId))}</div>`+l.map(cardCand).join('')).join('')+leg.map(c=>cardAdm(c)).join(''),cands.length+leg.length)}

function cardAdm(c){

  let chips='';
  if(['e1','e2'].includes(c.etapa))chips=`<span class="chip no" title="Cadastro criado antes da requisição de vaga">sem requisição vinculada</span>`;
  else if(c.etapa==='e3')chips=`<span class="chip">${c.cpf?'dados pessoais ok':'completar dados pessoais'}</span>`;
  else{const d=docsInfo(c);const tr=reqTreinos(c);const trOk=tr.filter(t=>{const v=treinoVal(c,t);return v&&v>=dataLiberacao(c)}).length;
    chips=`<span class="chip ${d.rec===d.tot?'ok':d.rec?'':'no'}">Docs ${d.rec}/${d.tot}</span>${idx>=et.findIndex(e=>e.id==='e5')?`<span class="chip ${c.aso?.data&&c.aso.apto==='Apto'?'ok':'no'}">ASO</span>`:''}${idx>=et.findIndex(e=>e.id==='e6')?`<span class="chip ${c.registro?.ok?'ok':'no'}">Registro</span>`:''}${idx>=et.findIndex(e=>e.id==='e7')?`<span class="chip ${trOk===tr.length?'ok':trOk?'':'no'}">NR ${trOk}/${tr.length}</span>`:''}`;
    if([ETAPA_AGUARDA,ETAPA_LIB].includes(c.etapa)){const p=pendLiberacao(c);chips+=p.length?`<span class="chip no">${p.length} pendência(s)</span>`:'<span class="chip ok">sem pendências</span>'}}

  if(ok){const d=p.inicio<hoje?hoje:p.inicio;const ch=p.chegada&&p.chegada>d?p.chegada:'';transferir(c,p.obraId,d,p.motivo.replace('Transferência – ',''),'programada',{retorno:p.retorno,hospOp:p.hospOp,leito:p.leito,mobKey:p.mobKey,chegada:ch});
    const n=c.alocacoes.find(x=>x.status!=='proposta'&&x.obraId===p.obraId&&x.inicio===d&&!x.retornoDe);if(n&&p.excecao)n.excecao=p.excecao;
    c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta para ${nomeObra(p.obraId)} aprovada e programada (revalidada na aprovação).`,autor:perfilNome()})}
  else c.historico.push({data:hoje,tipo:'Transferência',texto:`Proposta de transferência para ${nomeObra(p.obraId)} recusada.`,autor:perfilNome()});
  save();
}

function blocoCons(o,x,principal){

const relCols=k=>{const c=RELS[k].cols;return typeof c==='function'?c():c};
function relCatalogo(){return Object.keys(REL_META).filter(k=>RELS[k]&&(!REL_META[k].p||pode(REL_META[k].p)))}
const OBRA_COLS=/^(Obra|Origem|Destino|De|Para)$/;
const sortVal=v=>{const s=String(v??'');const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+m[2]+m[1];const n=s.replace(/[R$\s.%+]/g,'').replace(',','.');return /^-?\d+(\.\d+)?$/.test(n)?+n:s.toLowerCase()};
function relRows(k){
  const cols=relCols(k);let rows=RELS[k].rows();const e=escopo();
  if(e){const nomes=new Set(e.map(nomeObra));const idx=cols.map((c,i)=>OBRA_COLS.test(c)?i:-1).filter(i=>i>=0);if(idx.length)rows=rows.filter(r=>idx.some(i=>nomes.has(r[i])))}
  const s=UI.relSort;if(s&&s.rel===k)rows=rows.slice().sort((a,b)=>{const x=sortVal(a[s.i]),y=sortVal(b[s.i]);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))*s.dir});
  return rows;
}

function csvLinhas(txt){
  const t=String(txt).replace(/^﻿/,'').replace(/\r\n?/g,'\n');const pri=t.split('\n')[0]||'';
  const del=(pri.match(/;/g)||[]).length>(pri.match(/,/g)||[]).length?';':',';const q=pri.trim().startsWith("'")?"'":'"';
  const out=[];let row=[],cel='',dentro=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(dentro){if(ch===q){if(t[i+1]===q){cel+=q;i++}else dentro=false}else cel+=ch;continue}
    if(ch===q&&cel==='')dentro=true;else if(ch===del){row.push(cel);cel=''}else if(ch==='\n'){row.push(cel);out.push(row);row=[];cel=''}else cel+=ch}
  if(cel!==''||row.length){row.push(cel);out.push(row)}
  return out.filter(r=>r.some(x=>x.trim()!==''));
}
const ehSolides=txt=>/^﻿?['"]?0?1\s*-\s*NOME/i.test(String(txt).trim());
const hhmm=s=>{s=String(s||'').trim();if(!s)return {v:0};const m=s.match(/^(-?)(\d{1,3}):([0-5]\d)$/);if(!m)return {erro:true};const v=+m[2]*60+ +m[3];return {v:m[1]?-v:v}};
const DSEM=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function lerSolides(txt){
  const L=csvLinhas(txt);const h=L[0].map(x=>x.replace(/^\d+\s*-\s*/,'').trim().toUpperCase());
  const ix=k=>h.findIndex(x=>x.startsWith(k));
  const I={nome:ix('NOME'),cpf:ix('CPF'),data:ix('DIA / M'),sem:ix('DIA DA SEMANA'),trab:ix('TRABALHADAS'),abon:ix('ABONADAS'),prev:ix('PREVISTAS'),saldo:ix('SALDO')};
  const turnos=h.map((x,i)=>/^TURNO/.test(x)?i:-1).filter(i=>i>=0);
  const errosArq=Object.entries(I).filter(([,v])=>v<0).map(([k])=>`Coluna não encontrada: ${k}`);
  const pessoas=new Map();const meses=new Set();
  L.slice(1).forEach((r,k)=>{const n=k+2;const cpf=soDig(r[I.cpf]);const key=cpf||normNome(r[I.nome]);
    let p=pessoas.get(key);if(!p){p={nome:(r[I.nome]||'').trim(),cpf,dias:[],erros:[]};pessoas.set(key,p)}
    const m=String(r[I.data]||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m){p.erros.push(`Linha ${n}: data inválida "${r[I.data]}".`);return}
    const d=`${m[3]}-${m[2]}-${m[1]}`;meses.add(d.slice(0,7));
    const v={};for(const k2 of ['trab','abon','prev','saldo']){const x=hhmm(r[I[k2]]);if(x.erro){p.erros.push(`Linha ${n} (${fmt(d)}): valor "${r[I[k2]]}" inválido em ${h[I[k2]].toLowerCase()} (use hh:mm).`);return}v[k2]=x.v}
    if(r[I.sem]&&DSEM[parse(d).getDay()]!==r[I.sem].trim())p.erros.push(`Linha ${n}: ${fmt(d)} não é ${r[I.sem]}.`);
    const marc=turnos.map(i=>String(r[i]||'').trim()).filter(Boolean);
    p.dias.push({d,linha:n,...v,marc:marc.length,saldoInformado:String(r[I.saldo]||'').trim()!==''});
  });
  return {formato:'Sólides · espelho diário',errosArq,meses:[...meses].sort(),pessoas:[...pessoas.values()]};
}
/* Consolida um colaborador no mês: mesmas unidades e validações do lançamento manual */
function consolidarSolides(p,c,cp){
  const fs=new Set(DB.cfg.feriados||[]);const r={faltas:0,atrasos:0,he50m:0,he100m:0,abonos:[],justificadas:[],faltasDias:[],pend:[],avisos:[]};
  const dias=p.dias.filter(x=>x.d.slice(0,7)===cp).sort((a,b)=>a.d.localeCompare(b.d));let seq=[];
  dias.forEach(x=>{const w=parse(x.d).getDay();const feriado=fs.has(x.d)||(!x.prev&&w>=1&&w<=5);
    const aus=c?ausenteEm(c,x.d).filter(a=>!a.proj):[];
    if(x.marc%2){r.pend.push(`${fmt(x.d)}: marcação incompleta (${x.marc} batida(s)); dia não computado em atrasos ou horas extras`);if(x.abon)r.abonos.push(x.d);return}
    if(x.saldoInformado&&x.saldo!==x.trab+x.abon-x.prev)r.avisos.push(`${fmt(x.d)}: saldo da Sólides diferente de trabalhadas + abonadas − previstas`);
    if(x.abon){r.abonos.push(x.d)}
    if(x.prev>0&&!x.trab&&!x.abon){if(aus.length)r.justificadas.push(`${fmt(x.d)} (${aus[0].tipo.toLowerCase()})`);else{r.faltas++;r.faltasDias.push(x.d);seq.push(x.d)}}else if(x.prev>0)seq=[];
    if(seq.length===5)r.avisos.push(`${seq.length}+ dias seguidos sem marcação a partir de ${fmt(seq[0])}: confira se há folga, férias ou afastamento não registrado`);
    if(x.trab>0&&aus.length)r.avisos.push(`${fmt(x.d)}: marcou ponto durante ${aus[0].tipo.toLowerCase()} registrada no nTeam`);
    if(x.trab>0&&x.prev>0){if(x.saldo<0)r.atrasos+=-x.saldo;else if(x.saldo>0)r.he50m+=x.saldo}
    if(x.trab>0&&!x.prev){if(w===6&&!fs.has(x.d))r.he50m+=x.trab;else r.he100m+=x.trab}
  });
  if(dias.length&&!dias.some(x=>x.trab))r.avisos.push('nenhuma marcação no mês: confira se a pessoa usa o ponto, se está afastada ou se já saiu');
  r.vals={faltas:r.faltas,atrasos:r.atrasos,he50:Math.round(r.he50m/60*100)/100,he100:Math.round(r.he100m/60*100)/100};
  return r;
}
function prepararImportSolides(txt,arquivo){
  const s=lerSolides(txt);const cp=s.meses.length===1?s.meses[0]:null;
  const linhas=s.pessoas.map(p=>{const cs=DB.colabs.filter(c=>soDig(c.cpf)&&soDig(c.cpf)===p.cpf);const c=cs.length===1?cs[0]:null;
    const L={nome:p.nome,cpfM:mascCPF(p.cpf),c,erros:p.erros.slice(),avisos:[],pend:[],vals:null,res:null};
    if(p.cpf.length!==11)L.erros.push('CPF ausente ou inválido no arquivo.');
    if(cs.length>1)L.erros.push('CPF repetido em mais de um cadastro do nTeam.');
    else if(!c)L.erros.push('CPF não encontrado no nTeam (cadastre o colaborador ou corrija o CPF na ficha).');
    else{if(!noEscopoC(c))L.erros.push('Fora do seu escopo.');if(normNome(c.nome)!==normNome(p.nome))L.avisos.push(`Nome diferente no nTeam (${c.nome}); vinculado pelo CPF.`)}
    if(cp&&!L.erros.length){const res=consolidarSolides(p,c,cp);L.res=res;L.vals=res.vals;L.pend=res.pend;L.avisos=L.avisos.concat(res.avisos);
      ['faltas','atrasos','he50','he100'].forEach(k=>{const v=validarPonto(c,cp,k,String(res.vals[k]).replace('.',','));if(!v.ok)L.erros.push(v.erro)})}
    return L});
  return {formato:s.formato,arquivo,cp,meses:s.meses,errosArq:s.errosArq.concat(s.meses.length>1?[`O arquivo tem mais de uma competência (${s.meses.map(compLabel).join(', ')}). Exporte um mês por vez.`]:s.meses.length?[]:['Nenhuma data válida no arquivo.']),linhas,nDias:s.pessoas.reduce((x,p)=>x+p.dias.length,0)};
}

/* ---------- rascunhos: o que foi digitado num painel não se perde ---------- */
const RASC_KEY='nteam-rascunhos';
const rascLer=()=>{try{return JSON.parse(sessionStorage.getItem(RASC_KEY)||'{}')}catch(e){return {}}};
const rascGravar=o=>{try{sessionStorage.setItem(RASC_KEY,JSON.stringify(o))}catch(e){}};
const chaveRasc=t=>String(t).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
function rascSalvar(form){
  const k=form.dataset.rasc;if(!k)return;const v={};
  form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(el.type==='file'||el.disabled)return;if(el.dataset.mexido!=='1')return;v[el.name]=el.type==='checkbox'?(el.checked?'1':''):el.value});
  const o=rascLer();if(Object.keys(v).length)o[k]={v,em:Date.now(),titulo:form.dataset.rascTit||'',por:(typeof pessoaAtual==='function'?pessoaAtual().nome:'')};else delete o[k];rascGravar(o);
}
function rascDescartar(k){const o=rascLer();delete o[k];rascGravar(o)}
function rascRestaurar(form){
  const k=form.dataset.rasc;const r=rascLer()[k];if(!r)return false;let n=0;
  for(const [nm,val] of Object.entries(r.v)){const el=form.querySelector(`[name="${CSS.escape(nm)}"]`);if(!el||el.type==='file')continue;
    if(el.type==='checkbox')el.checked=!!val;else el.value=val;el.dataset.mexido='1';n++}
  if(!n)return false;
  form.querySelector('.bd').insertAdjacentHTML('afterbegin',`<div class="rasc-aviso full" role="status"><span>Rascunho de <b>${esc(r.titulo||'este formulário')}</b> salvo em ${new Date(r.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${r.por?' por '+esc(r.por):''}. Confira antes de salvar.</span><button type="button" class="btn small ghost" data-act="rascDescartar">Descartar rascunho</button></div>`);
  return true;
}

/* ---------- painéis: lateral para tarefas, diálogo central só para confirmação destrutiva ---------- */
let modalSubmitV6=null;
function modal(title,body,okLabel,onSubmit,wide,opts={}){
  const trig=OV.trig,trigSel=OV.trigSel;
  fecharPaineis(false);
  const destr=!!opts.destr;
  const d=document.createElement('div');
  d.className='modal '+(destr?'dlg':'sheet'+(wide?' sheet-wide':''));
  d._trig=trig;d._trigSel=trigSel;
  d.innerHTML=`<div class="scrim" data-act="closeModal"></div><form class="box ${wide?'wide':''}" role="${destr?'alertdialog':'dialog'}" aria-modal="true" aria-labelledby="mdl-t" novalidate>
    <header><h2 id="mdl-t">${title}</h2><button type="button" class="x-btn" data-act="closeModal" aria-label="Fechar painel" data-tip="Fechar painel" data-kbd="Esc">×</button></header>
    <div class="bd form">${body}</div>
    <footer><button type="button" class="btn" data-act="modalCancelar">Cancelar</button><button class="btn ${destr?'danger-solid':'primary'}" type="submit">${okLabel}</button></footer></form>`;
  $('#layer').appendChild(d);
  const f=d.querySelector('form');
  f.dataset.rasc=destr?'':chaveRasc(title)+'|'+(trigSel||'');f.dataset.rascTit=chaveRasc(title);
  modalSubmit=onSubmit;modalSubmitV6=onSubmit;
  f.addEventListener('submit',e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
    const k=f.dataset.rasc;if(modalSubmitV6(fd)!==false){f.dataset.rasc='';rascDescartar(k);closeModal()}});
  if(!destr)rascRestaurar(f);
  prepararCampos(f);
  if(destr)f.querySelector('footer [data-act="modalCancelar"]').focus();
  else (f.querySelector('.bd input:not([type=checkbox]):not([type=hidden]):not([disabled]),.bd select:not([disabled]),.bd textarea')||f.querySelector('footer .btn'))?.focus();
  document.body.classList.add('com-painel');
}
function modalD(title,body,okLabel,onSubmit,wide){return modal(title,body,okLabel,onSubmit,wide,{destr:true})}
function confirmar(title,texto,okLabel,acao){
  modalD(title,`<p class="full" style="margin:0">${texto}</p>`,okLabel,()=>{acao()});
}
function modalInfo(title,body,wide=true){
  const trig=OV.trig,trigSel=OV.trigSel;
  fecharPaineis(false);
  const d=document.createElement('div');d.className='modal sheet'+(wide?' sheet-wide':'');d._trig=trig;d._trigSel=trigSel;
  d.innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="box ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mdl-t">
    <header><h2 id="mdl-t">${title}</h2><button type="button" class="x-btn" data-act="closeModal" aria-label="Fechar painel" data-tip="Fechar painel" data-kbd="Esc">×</button></header>

function fecharPaineis(devolver){
  let trig=null,sel=null;
  document.querySelectorAll('#layer .modal').forEach(m=>{const f=m.querySelector('form');if(f&&f.dataset.rasc)rascSalvar(f);trig=m._trig;sel=m._trigSel;m.remove()});
  document.body.classList.remove('com-painel');
  if(devolver&&(trig||sel))devolverFoco(trig,sel);
}
function closeModal(){fecharPaineis(true)}

/* ---------- validação de formulário: ao sair do campo; erro some ao voltar a ele ---------- */
function rotuloDe(el){
  const l=el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`);
  return (l?l.textContent:el.getAttribute('aria-label')||el.name||'este campo').replace(/\(.*?\)/g,'').replace(/[:*]/g,'').trim();
}
function erroDoCampo(el){
  const v=(el.value||'').trim();
  if(el.required&&!v&&el.type!=='checkbox')return `Preencha ${rotuloDe(el).toLowerCase()}.`;
  if(el.required&&el.type==='checkbox'&&!el.checked)return 'Marque esta opção para continuar.';
  if(!v)return '';
  if(el.type==='number'){const n=Number(v);
    if(!Number.isFinite(n))return 'Use só números, por exemplo 2 ou 1,5.';
    const mn=el.min!==''?Number(el.min):null,mx=el.max!==''?Number(el.max):null;
    if(mn!==null&&mx!==null&&(n<mn||n>mx))return `Use um valor de ${mn} a ${mx}.`;
    if(mn!==null&&n<mn)return `Use um valor a partir de ${mn}.`;
    if(mx!==null&&n>mx)return `Use um valor até ${mx}.`;}
  if(el.type==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return 'Use uma data completa (dia, mês e ano).';
  return '';
}
function mostrarErro(el,msg){
  limparErro(el);
  const id=(el.id||('c'+Math.random().toString(36).slice(2,8)))+'-erro';if(!el.id)el.id=id.replace(/-erro$/,'');
  el.setAttribute('aria-invalid','true');
  const p=document.createElement('p');p.className='ferr';p.id=id;p.setAttribute('role','alert');p.textContent=msg;
  el.insertAdjacentElement('afterend',p);
  el.setAttribute('aria-describedby',[el.getAttribute('aria-describedby'),id].filter(Boolean).join(' '));
}
function limparErro(el){
  if(el.getAttribute('aria-invalid')!=='true'&&!el.nextElementSibling?.classList.contains('ferr'))return;
  el.removeAttribute('aria-invalid');
  const p=el.nextElementSibling;if(p&&p.classList.contains('ferr')){
    const ids=(el.getAttribute('aria-describedby')||'').split(' ').filter(x=>x&&x!==p.id);
    ids.length?el.setAttribute('aria-describedby',ids.join(' ')):el.removeAttribute('aria-describedby');p.remove()}
}
function prepararCampos(f){
  f.querySelectorAll('input,select,textarea').forEach(el=>{
    if(el.type==='hidden')return;
    // rótulo visível: obrigatório marcado; opcional pela ausência da marca
    const l=el.id&&f.querySelector(`label[for="${CSS.escape(el.id)}"]`);
    if(l&&el.required&&!l.querySelector('.obrig'))l.insertAdjacentHTML('beforeend',' <span class="obrig" aria-hidden="true">*</span>');
  });
}
document.addEventListener('focusout',e=>{
  const el=e.target;if(!el.matches?.('#layer .modal form input,#layer .modal form select,#layer .modal form textarea'))return;
  if(el.type==='checkbox'||el.type==='file')return;
  el.dataset.tocado='1';const m=erroDoCampo(el);m?mostrarErro(el,m):limparErro(el);
});
document.addEventListener('focusin',e=>{if(e.target.matches?.('[aria-invalid="true"]')&&e.target.closest('#layer .modal'))limparErro(e.target)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.closest?.('#layer .modal form')){el.dataset.mexido='1';limparErro(el);const f=el.closest('form');clearTimeout(f._rt);f._rt=setTimeout(()=>rascSalvar(f),250)}},true);
document.addEventListener('change',e=>{const el=e.target;if(el.closest?.('#layer .modal form')){el.dataset.mexido='1';const f=el.closest('form');rascSalvar(f)}},true);
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.closest('#layer .modal'))return;
  const ruins=[...f.querySelectorAll('input,select,textarea')].filter(el=>!el.disabled&&el.type!=='hidden'&&el.required&&erroDoCampo(el));
  if(ruins.length){e.preventDefault();e.stopImmediatePropagation();
    ruins.forEach(el=>mostrarErro(el,erroDoCampo(el)));
    ruins[0].scrollIntoView({block:'center'});ruins[0].focus({preventScroll:true});
    // foco limpa o erro do primeiro campo; reexibe para quem lê a tela
    setTimeout(()=>{if(!ruins[0].value)mostrarErro(ruins[0],erroDoCampo(ruins[0]))},0);}
},true);

/* ---------- foco preso no painel aberto; Esc fecha menus ---------- */
const FOCAVEIS='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=document.querySelector('details.menu[open]');if(m&&!document.querySelector('#layer .modal')){m.open=false;m.querySelector('summary').focus();e.stopImmediatePropagation();return}}
  if(e.key!=='Tab')return;
  const top=document.querySelector('#layer .modal .box')||document.querySelector('#layer > .drawer');if(!top)return;
  const n=[...top.querySelectorAll(FOCAVEIS)].filter(x=>x.offsetParent!==null||x===document.activeElement);if(!n.length)return;
  const a=n[0],z=n[n.length-1];
  if(!top.contains(document.activeElement)){e.preventDefault();a.focus();return}
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
},true);

/* ---------- campos de filtro com rótulo visível; células de tabela ligadas ao cabeçalho ---------- */
const ROT_CHG={atesPer:'Período',atesObra:'Obra',pontoObra:'Obra',relObra:'Obra',relVinc:'Vínculo',hospObra:'Obra',painelObra:'Obra',painelVinc:'Vínculo',planObra:'Obra',planFuncao:'Função',fObra:'Obra',fStatus:'Status',fFuncao:'Função',fVinc:'Vínculo',alertTipo:'Tipo',pontoComp:'Competência'};
let idSeq=0;const novoId=p=>`${p}-${++idSeq}`;
function rotularCampos(root){
  root.querySelectorAll('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea').forEach(el=>{
    if(el.closest('#layer .modal')||el.closest('.tema'))return;
    if(el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`))return;
    if(el.closest('label')||el.getAttribute('aria-labelledby'))return;
    const fl0=el.parentElement?.matches('.field')&&el.parentElement.querySelector(':scope > label:not([for])');
    if(fl0){el.id||=novoId('fld');fl0.setAttribute('for',el.id);el.removeAttribute('aria-label');return}
    const td=el.closest('td');
    if(td){const tr=td.parentElement,tab=td.closest('table');const i=[...tr.children].indexOf(td);
      const th=tab?.querySelector('thead tr')?.children[i];const ids=[];
      if(th&&th.textContent.trim()){th.id||=novoId('th');ids.push(th.id)}
      const c0=tr.children[0];if(c0&&c0!==td&&c0.textContent.trim()){const alvo=c0.querySelector('.av-txt > :first-child, a, button, b')||c0;alvo.id||=novoId('rw');ids.push(alvo.id)}
      if(ids.length){el.setAttribute('aria-labelledby',ids.join(' '));el.removeAttribute('aria-label');return}}
    const txt=el.getAttribute('aria-label')||ROT_CHG[el.dataset.chg]||ROT_CHG[el.dataset.inp]||(el.placeholder&&el.placeholder.length<30?el.placeholder:'');
    if(!txt)return;
    el.id||=novoId('fld');
    const w=document.createElement('label');w.className='fl';w.setAttribute('for',el.id);
    w.innerHTML=`<span class="fl-t">${esc(txt)}</span>`;
    el.replaceWith(w);w.appendChild(el);el.removeAttribute('aria-label');
  });
}

/* ---------- dicas (tooltip real, também no foco do teclado) ---------- */
let dicaEl=null;
function mostrarDica(el){
  const t=el.dataset.tip;if(!t)return;esconderDica();
  dicaEl=document.createElement('div');dicaEl.className='dica';dicaEl.setAttribute('role','tooltip');dicaEl.id='dica-ativa';
  dicaEl.innerHTML=esc(t)+(el.dataset.kbd?` <kbd>${esc(el.dataset.kbd)}</kbd>`:'');
  document.body.appendChild(dicaEl);
  const r=el.getBoundingClientRect(),d=dicaEl.getBoundingClientRect();
  let x=r.left+r.width/2-d.width/2;x=Math.max(8,Math.min(x,innerWidth-d.width-8));
  let y=r.top-d.height-8;if(y<8)y=r.bottom+8;
  dicaEl.style.left=x+'px';dicaEl.style.top=y+'px';
}
function esconderDica(){dicaEl?.remove();dicaEl=null}

const CAT_HE={util:'Dias úteis',sab:'Sábados',dom:'Domingos',fer:'Feriados'};

/* ---------- calendário e jornada por obra ---------- */
const ehFeriado=(o,d)=>(DB.cfg.feriados||[]).includes(d)||(O(o)?.feriados||[]).includes(d);
const diaSem=d=>parse(d).getDay();
function catDia(o,d){if(ehFeriado(o,d))return 'fer';const w=diaSem(d);return w===0?'dom':w===6?'sab':'util'}
function jornadaDia(o,d){ // minutos previstos de trabalho no dia (0 = sem expediente)
  if(ehFeriado(o,d))return 0;const w=diaSem(d);const j=O(o)?.jornada;
  if(j&&j[w]!=null&&j[w]!=='')return +j[w];
  return w>=1&&w<=5?(+DB.cfg.jornadaMin||528):0;
}

/* ---------- regras de adicional de HE por obra (com vigência) ---------- */
function regrasHE(o){return (O(o)?.heRegras||[])}
function regraHE(o,cat,d){return regrasHE(o).filter(r=>r.cat===cat&&r.inicio<=d&&(!r.fim||r.fim>=d)).sort((a,b)=>b.inicio.localeCompare(a.inicio))[0]||null}
function validarRegraHE(o,nova){
  const pct=Number(String(nova.pct).replace(',','.'));
  if(!Number.isFinite(pct))return 'Informe o adicional em %, por exemplo 50 ou 60.';
  if(pct<0)return 'O adicional não pode ser negativo.';
  if(pct>300)return 'Adicional acima de 300%: confira o valor (60% de adicional = hora × 1,60).';
  if(!CAT_HE[nova.cat])return 'Escolha a categoria de dia.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(nova.inicio||''))return 'Informe o início da vigência.';
  if(!String(nova.ref||'').trim())return 'Informe a referência da regra (acordo, convenção ou decisão da empresa).';
  const conflito=regrasHE(o).find(r=>r.cat===nova.cat&&r.inicio===nova.inicio);
  if(conflito)return `Já existe regra de ${CAT_HE[nova.cat].toLowerCase()} começando em ${fmt(nova.inicio)}: regras com o mesmo início são ambíguas. Ajuste a data.`;
  const depois=regrasHE(o).filter(r=>r.cat===nova.cat&&r.inicio>nova.inicio);
  if(depois.length)return `Já existe regra de ${CAT_HE[nova.cat].toLowerCase()} a partir de ${fmt(depois[0].inicio)}. Inclua regras em ordem de vigência para não sobrepor períodos.`;
  return '';
}
function impactoRegraHE(o,cat,inicio,pct){ // prévia: lançamentos diários já existentes que a regra alcançaria
  const recs=(DB.pontoDia||[]).filter(r=>r.obraId===o&&r.data>=inicio&&(r.extra?.[cat]||0)>0);
  const comps=[...new Set(recs.map(r=>r.data.slice(0,7)))].sort();
  let custoAntes=0,custoDepois=0,min=0;
  recs.forEach(r=>{const c=C(r.colabId);const sh=salHora(c);const m=r.extra[cat];min+=m;const pa=r.pct?.[cat]??regraHE(o,cat,r.data)?.pct??0;custoAntes+=m/60*sh*(1+pa/100);custoDepois+=m/60*sh*(1+pct/100)});
  return {n:recs.length,comps,min,custoAntes,custoDepois,fechadas:comps.filter(cp=>pontoFechado(cp))};
}
function aplicarRegraHE(o,nova,autor,retro,just){
  const ob=O(o);ob.heRegras??=[];
  const ant=ob.heRegras.filter(r=>r.cat===nova.cat&&!r.fim&&r.inicio<nova.inicio);
  ant.forEach(r=>{r.fim=addD(nova.inicio,-1)});
  ob.heRegras.push({id:uid(),cat:nova.cat,nome:nova.nome||CAT_HE[nova.cat],pct:+String(nova.pct).replace(',','.'),inicio:nova.inicio,fim:null,ref:String(nova.ref).trim(),por:autor,em:new Date().toISOString(),retroativa:!!retro,just:just||''});
  if(retro){ // correção retroativa: os lançamentos alcançados passam a registrar a regra nova (fica na trilha)
    (DB.pontoDia||[]).filter(r=>r.obraId===o&&r.data>=nova.inicio&&(r.extra?.[nova.cat]||0)>0).forEach(r=>{r.pct={...(r.pct||{}),[nova.cat]:+String(nova.pct).replace(',','.')};r.corrigidoPor=autor.nome;r.correcaoJust=just})}
}
const salHora=c=>c&&+c.salario?(+c.salario)/220:0; // divisor 220 h (44 h semanais) — premissa do protótipo

/* ---------- base diária de ponto ---------- */
// registro: {id,colabId,obraId,data,normMin,extra:{util,sab,dom,fer},pct:{cat:%},situacao:'Provisório'|'Conferido',origem,lote,por,em,obs}
function regsDia(colabId,d){return (DB.pontoDia||[]).filter(r=>r.colabId===colabId&&r.data===d)}
function validarRegDia(r,ignorarId){
  const c=C(r.colabId);if(!c)return 'Escolha o colaborador.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data||''))return 'Informe a data.';
  if(r.data>hoje)return 'Lançamento de horas trabalhadas só até hoje.';
  if(!O(r.obraId))return 'Escolha a obra em que as horas foram trabalhadas.';
  const tot=(+r.normMin||0)+Object.values(r.extra||{}).reduce((s,x)=>s+(+x||0),0);
  if((+r.normMin||0)<0||Object.values(r.extra||{}).some(x=>+x<0))return 'Horas não podem ser negativas.';
  const outros=regsDia(r.colabId,r.data).filter(x=>x.id!==ignorarId);
  if(outros.some(x=>x.obraId===r.obraId))return `Já existe lançamento de ${c.nome} em ${obraCurta(r.obraId)} neste dia: edite o lançamento existente para não contar duas vezes.`;
  const soma=outros.reduce((s,x)=>s+(+x.normMin||0)+Object.values(x.extra||{}).reduce((a,y)=>a+(+y||0),0),0)+tot;
  if(outros.length&&!r.dividido)return `${c.nome} já tem horas em ${outros.map(x=>obraCurta(x.obraId)).join(', ')} neste dia. Para dividir o dia entre obras, marque "Dividir o dia entre obras" e informe só as horas desta obra.`;
  if(soma>16*60)return `A soma das horas de ${c.nome} no dia passaria de 16 h (${(soma/60).toFixed(1).replace('.',',')} h): confira para não contar horas em dobro.`;
  return '';
}
function novoRegDia(o){const cat=catDia(o.obraId,o.data);const r={id:uid(),colabId:o.colabId,obraId:o.obraId,data:o.data,normMin:+o.normMin||0,extra:{},pct:{},situacao:o.situacao||'Provisório',origem:o.origem||'Lançamento manual',lote:o.lote||'',por:o.por||autorAtual().nome,em:new Date().toISOString(),obs:o.obs||'',dividido:!!o.dividido};
  Object.entries(o.extra||{}).forEach(([k,v])=>{if(+v>0){r.extra[k]=+v;r.pct[k]=regraHE(o.obraId,k,o.data)?.pct??null}});
  if(o.extraMin>0){r.extra[cat]=(r.extra[cat]||0)+(+o.extraMin);r.pct[cat]=regraHE(o.obraId,cat,o.data)?.pct??null}
  return r}
function esperadoNoDia(c,o,d){ // a pessoa deveria trabalhar nesta obra neste dia?
  if(c.admissao&&d<c.admissao)return false;if(c.desligamento&&d>c.desligamento.data)return false;if(c.status==='Admissão')return false;
  const a=vigente(c,d);if(!a||a.obraId!==o)return false;
  if(ausenteEm(c,d).some(x=>!x.proj))return false;
  return jornadaDia(o,d)>0;
}

/* ---------- HH: cálculos puros (testáveis) ---------- */
const hhPlanejadoDia=(posicoes,jornMin)=>(+posicoes||0)*(+jornMin||0)/60;
function hhRealizado(regs){let n=0,e=0;regs.forEach(r=>{n+=(+r.normMin||0);e+=Object.values(r.extra||{}).reduce((s,x)=>s+(+x||0),0)});return {normal:n/60,extra:e/60,total:(n+e)/60}}
function custoHE(regs){let v=0,semSal=0;regs.forEach(r=>{const c=C(r.colabId);const sh=salHora(c);Object.entries(r.extra||{}).forEach(([cat,m])=>{const pct=r.pct?.[cat]??regraHE(r.obraId,cat,r.data)?.pct??0;if(!sh)semSal+=m;v+=m/60*sh*(1+pct/100)})});return {valor:v,semSal}}
const pctDif=(real,plan)=>plan>0?(real-plan)/plan*100:null;

/* HH do período, por dia, com filtros */
function hhPeriodo(f){ // f: {de,ate,obra,funcao,frente,colab}
  const obras=DB.cfg.obras.filter(o=>(!f.obra||o.id===f.obra)&&noEscopo(o.id)).map(o=>o.id);
  const funcs=DB.cfg.funcoes.filter(x=>!f.funcao||x.id===f.funcao).map(x=>x.id);
  const dias=[];for(let d=f.de;d<=f.ate;d=addD(d,1))dias.push(d);
  const out=dias.map(d=>{let plan=0,orig=0,parcial=false;
    if(!f.colab)obras.forEach(o=>{const jm=jornadaDia(o,d);if(!jm)return;funcs.forEach(fn=>{
      if(f.frente){const p=necInfo(o,fn,d,false).partes.find(x=>x.frente===f.frente);if(p&&p.v!=null)plan+=hhPlanejadoDia(p.v,jm)}
      else{const v=necEm(o,fn,d,false);if(v!=null)plan+=hhPlanejadoDia(v,jm);const vo=necOriginal(o,fn,d);if(vo!=null)orig+=hhPlanejadoDia(vo,jm)}})});
    const regs=(DB.pontoDia||[]).filter(r=>r.data===d&&obras.includes(r.obraId)&&(!f.colab||r.colabId===f.colab)&&(!f.funcao||C(r.colabId)?.funcaoId===f.funcao));
    const re=hhRealizado(regs);
    // completude: pessoas esperadas no dia sem lançamento = pendentes
    let esperados=0,pend=0;const prov=regs.filter(r=>r.situacao!=='Conferido').length,conf=regs.filter(r=>r.situacao==='Conferido').length;
    if(d<=hoje)DB.colabs.filter(c=>(!f.colab||c.id===f.colab)&&(!f.funcao||c.funcaoId===f.funcao)).forEach(c=>obras.forEach(o=>{if(esperadoNoDia(c,o,d)){esperados++;if(!regsDia(c.id,d).length)pend++}}));
    return {d,plan,orig:f.frente||f.colab?null:orig,normal:re.normal,extra:re.extra,total:re.total,regs,conf,prov,pend,esperados,futuro:d>hoje};
  });
  return out;
}
function agrupar(dias,g){
  const chave=d=>g==='dia'?d:g==='semana'?segunda(d):d.slice(0,7);
  const m=new Map();dias.forEach(x=>{const k=chave(x.d);const a=m.get(k)||{k,plan:0,orig:0,origNull:x.orig==null,normal:0,extra:0,total:0,conf:0,prov:0,pend:0,esperados:0,regs:[],dias:0};
    a.plan+=x.plan;if(x.orig!=null)a.orig+=x.orig;a.normal+=x.normal;a.extra+=x.extra;a.total+=x.total;a.conf+=x.conf;a.prov+=x.prov;a.pend+=x.pend;a.esperados+=x.esperados;a.regs.push(...x.regs);a.dias++;m.set(k,a)});
  return [...m.values()];
}

/* ---------- documentos da obra ---------- */
function docsDaObra(o){return (DB.docsObra||[]).filter(x=>x.obraId===o)}
function versaoVigenteEm(doc,d){return (doc.versoes||[]).filter(v=>v.aprovado&&v.inicio<=d&&(!v.fim||v.fim>=d)).sort((a,b)=>b.inicio.localeCompare(a.inicio))[0]||null}
function estadoVersao(v,d=hoje){
  if(v.estado==='Rascunho'||v.estado==='Em análise'||v.estado==='Devolvido')return v.estado;
  if(!v.aprovado)return v.estado||'Rascunho';
  if(v.inicio>d)return 'Aprovada · vigente a partir de '+fmt(v.inicio);
  if(v.fim&&v.fim<d)return 'Substituída';
  return 'Vigente';
}
function prazoDoc(v){return v?.validade||v?.proxRev||''}
function situacaoDocsObra(o,d=hoje){
  const req=O(o)?.docsExigidos||[];const lista=docsDaObra(o);const ant=+(DB.cfg.antecedencia?.['Documento da obra']??30);
  const itens=[];
  req.forEach(t=>{const docs=lista.filter(x=>x.tipo===t);const vig=docs.map(x=>({doc:x,v:versaoVigenteEm(x,d)})).filter(x=>x.v);
    if(!vig.length)itens.push({tipo:t,sit:'faltante',doc:docs[0]||null,txt:docs.length?'sem versão vigente aprovada':'não cadastrado'})});
  lista.forEach(x=>{const v=versaoVigenteEm(x,d);if(!v)return;const p=prazoDoc(v);if(!p)return;const dd=dias(p);
    if(dd<0)itens.push({tipo:x.tipo,sit:'vencido',doc:x,v,txt:`${v.validade?'validade':'revisão prevista'} em ${fmt(p)}`,data:p});
    else if(dd<=ant)itens.push({tipo:x.tipo,sit:'proximo',doc:x,v,txt:`${v.validade?'vence':'revisão prevista'} em ${fmt(p)}`,data:p})});
  return itens;
}

/* ---------- avaliação no desligamento ---------- */
const CRIT_AVAL=[
  {k:'tecnica',rot:'Capacidade técnica durante a obra'},
  {k:'epi',rot:'Cumprimento das orientações de uso de EPIs'},
  {k:'convivio',rot:'Convívio e colaboração no ambiente de trabalho'},
  {k:'alojamento',rot:'Convívio e respeito às regras do alojamento',na:true}
];
const DESC_NOTA=['0 — Muito abaixo do esperado','1 — Abaixo do esperado','2 — Parcialmente adequado','3 — Adequado','4 — Acima do esperado','5 — Excelente'];
function validarAvaliacao(av,c){
  const falt=[];
  CRIT_AVAL.forEach(k=>{const r=av.respostas?.[k.k];
    if(!r||r.v===undefined||r.v===null||r.v==='')falt.push({campo:k.k,msg:`Responda "${k.rot}".`});
    else if(r.v==='na'&&!k.na&&!(r.c||'').trim())falt.push({campo:k.k,msg:`"Não se aplica" em ${k.rot.toLowerCase()} precisa de justificativa no comentário.`});
    else if(r.v==='na'&&k.na&&foiAlojado(c)&&!(r.c||'').trim())falt.push({campo:k.k,msg:'A pessoa teve estadia em alojamento: explique no comentário por que não se aplica.'});
    else if(r.v==='se'&&!(r.c||'').trim())falt.push({campo:k.k,msg:`"Não tenho elementos para avaliar" precisa de justificativa no comentário.`});
  });
  if(!(av.geral||'').trim())falt.push({campo:'geral',msg:'Escreva a observação geral, com exemplos objetivos do trabalho.'});
  else if((av.geral||'').trim().length<20)falt.push({campo:'geral',msg:'A observação geral precisa de pelo menos 20 caracteres, com exemplos objetivos.'});
  return falt;
}
function foiAlojado(c){return (DB.estadias||[]).some(e=>e.colabId===c.id&&['Ocupada','Encerrada'].includes(e.situacao))||c.regime==='Alojado'}
function mediaAval(av){const n=CRIT_AVAL.map(k=>av.respostas?.[k.k]?.v).filter(v=>typeof v==='number');return {media:n.length?n.reduce((s,x)=>s+x,0)/n.length:null,n:n.length,total:CRIT_AVAL.length}}

/* ---------- importação de colaboradores ---------- */

const CAMPO_IGNORAR=/^(v|limpezas|migracaoV4)$|(^|\.)(mobLog)(\.|$)/;
function classe(path){if(CAMPO_SAUDE.test(path))return 'saude';if(CAMPO_BANCO.test(path))return 'banco';if(CAMPO_PESSOAL.test(path))return 'pessoal';if(CAMPO_FIN.test(path))return 'financeiro';if(CAMPO_AVAL.test(path))return 'avaliacao';return ''}
const ROT_CAMPO={tel:'Telefone',email:'E-mail',cpf:'CPF',nasc:'Nascimento',sexo:'Sexo',end:'Endereço',salario:'Salário',regime:'Regime',nome:'Nome',status:'Status',obraId:'Obra',funcaoId:'Função',etapa:'Etapa',vinculo:'Vínculo',regime:'Regime',admissao:'Admissão',matricula:'Matrícula',inicio:'Início',fim:'Fim',qtd:'Quantidade',situacao:'Situação',aprov:'Aprovações',aprovador:'Aprovador',solicitante:'Solicitante',desligamento:'Desligamento',alocacoes:'Movimentações',ausencias:'Ausências',historico:'Histórico',hist:'Histórico',ponto:'Ponto',docs:'Documentos',docFiles:'Arquivos',treinos:'Treinamentos',aso:'ASO',registro:'Registro',cel:'Células do histograma',ajustes:'Ajustes',vigencia:'Vigência',estado:'Estado',versoes:'Versões',heRegras:'Regras de hora extra',pct:'Adicional (%)',normMin:'Minutos normais',extra:'Minutos extras'};
function rotCampo(p){return p.split('.').map(x=>ROT_CAMPO[x]||x).join(' › ')}
const valTxt=(path,v)=>{if(v===undefined||v===null||v==='')return '—';if(/obraId$/.test(path))return nomeObra(v);if(/funcaoId$/.test(path))return F(v)?.nome||v;if(typeof v==='object')return JSON.stringify(v).slice(0,160);return String(v).slice(0,160)};

/* ---------- comparação ---------- */
const ehColecao=a=>Array.isArray(a)&&a.length>0&&a.every(x=>x&&typeof x==='object'&&('id' in x||'aid' in x||'vid' in x));
const chaveDe=x=>x.id??x.aid??x.vid;
function rotuloRegistro(col,r){if(!r)return '';return r.nome||r.num||r.titulo||r.codigo||(r.colabId&&C(r.colabId)?.nome?`${C(r.colabId).nome}${r.data?' · '+fmt(r.data):''}`:'')||(r.obraId&&r.frente!==undefined?`${obraCurta(r.obraId)} · ${r.frente} · rev. ${r.num}`:'')||chaveDe(r)||col}
function obraDoRegistro(r){return r?.obraId||r?.obra||null}
function difCampos(a,b,pre,out,prof){
  if(out.length>80)return;
  if(JSON.stringify(a)===JSON.stringify(b))return;
  if(prof>=4||a===null||b===null||typeof a!=='object'||typeof b!=='object'||Array.isArray(a)!==Array.isArray(b)){out.push({campo:pre,de:a,para:b});return}
  if(Array.isArray(a)){
    if(ehColecao(a)||ehColecao(b)){const ma=new Map((a||[]).map(x=>[chaveDe(x),x])),mb=new Map((b||[]).map(x=>[chaveDe(x),x]));
      for(const [k,x] of mb){if(!ma.has(k))out.push({campo:pre,de:null,para:x,op:'incluiu'});else difCampos(ma.get(k),x,pre+'['+k+']',out,prof+1)}
      for(const [k,x] of ma)if(!mb.has(k))out.push({campo:pre,de:x,para:null,op:'removeu'});return}
    // listas sem identificador (históricos): só o que entrou ou saiu
    const sa=new Set(a.map(x=>JSON.stringify(x)));const novos=b.filter(x=>!sa.has(JSON.stringify(x)));const sb=new Set(b.map(x=>JSON.stringify(x)));const fora=a.filter(x=>!sb.has(JSON.stringify(x)));
    novos.forEach(x=>out.push({campo:pre,de:null,para:x,op:'incluiu'}));fora.forEach(x=>out.push({campo:pre,de:x,para:null,op:'removeu'}));return}
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>difCampos(a[k],b[k],pre?pre+'.'+k:k,out,prof+1));
}
function resumoValor(path,v){
  const cl=classe(path);
  if(cl==='saude'||cl==='banco')return {restrito:cl};          // nunca guarda o valor
  if(v&&typeof v==='object'){const t=v.texto||v.nome||v.tipo||v.titulo||v.motivo||'';return {txt:(t?String(t):JSON.stringify(v)).slice(0,200),cl}}
  return {txt:valTxt(path,v),cl};
}
function difBase(A,B){
  const evs=[];
  const reg=(col,ida,ra,rb)=>{const campos=[];difCampos(ra,rb,'',campos,0);
    const tipo=!ra?'Criação':!rb?'Exclusão':'Alteração';
    const r=rb||ra;evs.push({col,regId:ida,registro:rotuloRegistro(col,r),obraId:obraDoRegistro(r),tipo,
      campos:(tipo==='Alteração'?campos:[]).slice(0,60).map(c=>({campo:c.campo,rot:rotCampo(c.campo.replace(/\[[^\]]+\]/g,'')),op:c.op||'',de:resumoValor(c.campo,c.de),para:resumoValor(c.campo,c.para)})),
      mais:Math.max(0,campos.length-60)})};
  const percorrer=(a,b,col)=>{
    if(ehColecao(a)||ehColecao(b)){const ma=new Map((a||[]).map(x=>[chaveDe(x),x])),mb=new Map((b||[]).map(x=>[chaveDe(x),x]));
      for(const [k,x] of mb){const y=ma.get(k);if(!y)reg(col,k,null,x);else if(JSON.stringify(y)!==JSON.stringify(x))reg(col,k,y,x)}
      for(const [k,y] of ma)if(!mb.has(k))reg(col,k,y,null);return}
    if(JSON.stringify(a)!==JSON.stringify(b))reg(col,col,{v:a},{v:b});
  };
  const ks=new Set([...Object.keys(A||{}),...Object.keys(B||{})]);
  for(const k of ks){if(CAMPO_IGNORAR.test(k))continue;
    if(k==='cfg'){const ca=A.cfg||{},cb=B.cfg||{};for(const j of new Set([...Object.keys(ca),...Object.keys(cb)])){if(j==='perms'||j==='pessoas'||j==='obras'||j==='funcoes'){percorrer(ca[j],cb[j],'cfg.'+j);continue}
        if(JSON.stringify(ca[j])!==JSON.stringify(cb[j])){const campos=[];difCampos(ca[j],cb[j],j,campos,1);evs.push({col:'cfg',regId:'cfg.'+j,registro:'Configuração · '+j,obraId:null,tipo:'Alteração',campos:campos.slice(0,40).map(c=>({campo:c.campo,rot:rotCampo(c.campo.replace(/\[[^\]]+\]/g,'')),op:c.op||'',de:resumoValor(c.campo,c.de),para:resumoValor(c.campo,c.para)})),mais:Math.max(0,campos.length-40)})}}
      continue}
    percorrer(A[k],B[k],k)}
  return evs;
}
const NOME_COL={colabs:'Colaborador',reqs:'Requisição',cands:'Candidato',hist:'Histograma',mobs:'Mobilização',hospedagens:'Hospedagem',estadias:'Estadia',planos:'Plano de devolução',tarefas:'Tarefa',necessidades:'Necessidade de pessoal',docsObra:'Documento da obra',pontoDia:'Ponto diário',avaliacoes:'Avaliação de desligamento',lotesImport:'Lote de importação','cfg.obras':'Obra (configuração)','cfg.funcoes':'Função','cfg.pessoas':'Usuário','cfg.perms':'Permissão',cfg:'Configuração'};

function audRegistrar(autorForcado,origemForcada){
  if(!AUD_BASE)return;
  let evs;try{evs=difBase(AUD_BASE,DB)}catch(e){evs=[]}
  AUD_BASE=clone(DB);
  if(!evs.length)return;
  const ctx=CTX.acao;const sis=autorForcado||(CTX.sis?autorSistema('recálculo automático'):null);
  const autor=sis||ctx?.autor||autorSistema(origemForcada||'processo automático, sem ação de usuário');
  const acao=sis?`${sis.origem}${ctx?' — disparado por: '+ctx.acao:''}`:(ctx?.acao||origemForcada||'Alteração automática');
  const em=new Date().toISOString();
  const grande=evs.length>150;
  const lista=grande?[{col:'*',regId:'*',registro:`${evs.length} registros`,obraId:null,tipo:'Alteração em massa',campos:Object.entries(evs.reduce((m,e)=>{m[e.col]=(m[e.col]||0)+1;return m},{})).map(([c,n])=>({campo:c,rot:NOME_COL[c]||c,op:'',de:{txt:''},para:{txt:n+' registro(s)'}})),mais:0}]:evs;
  lista.forEach(e=>AUD.push(Object.freeze({id:uid(),acaoId:ctx?.id||uid(),em,autor,acao,modulo:sis?'Sistema':(ctx?.modulo||'—'),
    col:e.col,colNome:NOME_COL[e.col]||e.col,regId:e.regId,registro:e.registro,obraId:e.obraId,obraNome:e.obraId?nomeObra(e.obraId):'',
    tipo:e.tipo,campos:e.campos,mais:e.mais,just:sis?'':(ctx?.just||''),lote:ctx?.lote||''})));
  audGravar();
}
function comoSistema(fn,origem){return function(...a){audRegistrar();CTX.sis++;let r;try{r=fn.apply(this,a)}finally{CTX.sis--;audRegistrar(autorSistema(origem+(a[0]&&typeof a[0]==='string'?` (${a[0]})`:'')))}return r}}

function valorVisivel(v){
  if(!v)return '—';
  if(v.restrito)return `<span class="muted">(${v.restrito==='saude'?'dado de saúde':'dado bancário'} — valor não registrado na trilha)</span>`;
  if(v.cl==='pessoal'&&!pode('verDadosPessoais'))return '<span class="muted">(dado pessoal oculto para este perfil)</span>';
  if(v.cl==='financeiro'&&!pode('verFinanceiro'))return '<span class="muted">(valor financeiro oculto para este perfil)</span>';
  if(v.cl==='avaliacao'&&!pode('verAvaliacao'))return '<span class="muted">(avaliação oculta para este perfil)</span>';
  return esc(v.txt??'—');
}

/* ---------- download (capacidade "downloads" do artifact; fora dele, link local) ---------- */
async function baixar(nome,conteudo){
  try{const dl=window.claude?.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:nome,data:conteudo});toast('Arquivo pronto: '+nome);return}}
  catch(e){if(e?.code==='declined')return toast('Download cancelado.');}
  try{const b=new Blob([conteudo],{type:/\.csv$/.test(nome)?'text/csv;charset=utf-8':'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Arquivo pronto: '+nome)}
  catch(e){toast('Não foi possível baixar o arquivo neste ambiente. Copie a tabela pela tela.',true)}
}

  const rot=k=>f.g==='dia'?fmt(k):f.g==='semana'?'Sem. '+fmtC(k):compLabel(k);
  const max=Math.max(1,...ag.map(x=>Math.max(x.plan,x.total)));const W=Math.max(320,ag.length*44),H=180;const bw=Math.min(16,Math.floor((W/ag.length-8)/2));

      return `<g><title>${rot(x.k)}: planejado ${nf1(x.plan)} h; realizado ${nf1(x.total)} h (${nf1(x.normal)} normais + ${nf1(x.extra)} extras)</title><rect x="${cx-bw-1}" y="${H-hp}" width="${bw}" height="${hp}" class="b-plan"/><rect x="${cx+1}" y="${H-hn}" width="${bw}" height="${hn}" class="b-norm"/><rect x="${cx+1}" y="${H-hn-he}" width="${bw}" height="${he}" class="b-ext"/>${ag.length<=16?`<text x="${cx}" y="${H+16}" text-anchor="middle">${f.g==='mes'?compLabel(x.k):fmtC(x.k)}</text>`:''}</g>`}).join('')}<line x1="0" x2="${W}" y1="${H}" y2="${H}" class="eixo"/></svg>`;
  const fr=f.obra?frentesObra(f.obra):[];
